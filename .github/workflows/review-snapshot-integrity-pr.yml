# Shadow-mode publisher for the `Review Snapshot Integrity` commit status.
# Trusted pull_request_target on the default branch only; never checks out,
# fetches, interpolates, or executes pull-request-controlled content. The
# separate read-only merge_group workflow is PR2 and intentionally absent here.
name: Review Snapshot Integrity Publisher

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft]

permissions: {}

concurrency:
  group: review-snapshot-integrity-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    # Native job name must not collide with the explicit status context
    # `Review Snapshot Integrity` published by the script.
    name: Publish Snapshot Status
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # Trusted default-branch content only: base SHA of this repository,
      # no persisted credentials, no cache, no install, no artifacts.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - run: node scripts/review-snapshot-integrity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
