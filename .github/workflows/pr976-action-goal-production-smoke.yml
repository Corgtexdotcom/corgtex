name: PR 976 Action/Goal Production Smoke

on:
  workflow_dispatch:
    inputs:
      expected_deployed_sha:
        description: Exact deployed successor SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr976-action-goal-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Manual protected Action/Goal production smoke
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    env:
      PRODUCTION_BASE_URL: https://app.corgtex.com
      EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
      PRODUCTION_VALIDATION_ADMIN_EMAIL: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
      PRODUCTION_VALIDATION_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
      OUT_DIR: .artifacts/production-validation/pr976-action-goal
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required protected inputs
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$EXPECTED_DEPLOYED_SHA"
          test -n "$PRODUCTION_VALIDATION_ADMIN_EMAIL"
          test -n "$PRODUCTION_VALIDATION_ADMIN_PASSWORD"

      - name: Run application-backed smoke
        run: node .github/production-validation/pr976-action-goal-production-smoke.mjs

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr976-action-goal-production-smoke
          path: .artifacts/production-validation/pr976-action-goal
          if-no-files-found: error
