name: Recover Existing Core

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify incident, accepted receipt, database and image proofs without recovery writes
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  packages: read

# Shares the existing release exclusion and native environment approval.
concurrency:
  group: fleet-release
  cancel-in-progress: false

jobs:
  recover:
    name: Recover existing Core
    if: github.ref == 'refs/heads/main' && github.repository == 'Corgtexdotcom/corgtex'
    runs-on: ubuntu-latest
    environment: fleet-release-production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
      - name: Resolve original accepted receipt
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/core-recovery-runner.mjs prepare
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.baseline.outputs.source_sha }}
          path: .baseline/source
          persist-credentials: false
      # Dependency installation receives no production credentials.
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: .baseline/source
      - name: Authenticate existing durable package reader
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_IMPORT_USERNAME }}
          password: ${{ secrets.GHCR_IMPORT_TOKEN }}
      - name: Verify recovery plan without mutations
        if: inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          FLEET_RELEASE_BACKUP_APP_TARGET_JSON: ${{ vars.FLEET_RELEASE_BACKUP_APP_TARGET_JSON }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node scripts/release/core-recovery-runner.mjs plan
      # This exact persisted step is the once-per-incident deployment journal.
      # Any previous started attempt blocks resubmission after uncertainty.
      - name: Restore and verify incident-bound Core runtime
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          FLEET_RELEASE_BACKUP_APP_TARGET_JSON: ${{ vars.FLEET_RELEASE_BACKUP_APP_TARGET_JSON }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/release/core-recovery-runner.mjs recover
      - name: Preserve separate recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/core-recovery/*.json
          if-no-files-found: ignore
          retention-days: 90
      - name: State baseline adoption boundary
        if: success() && !inputs.dry_run
        run: |
          echo 'Core runtime recovery verified. The original accepted receipt and pin are unchanged.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The new deployment needs reviewed baseline adoption; retirement and migration remain incomplete.' >> "$GITHUB_STEP_SUMMARY"
