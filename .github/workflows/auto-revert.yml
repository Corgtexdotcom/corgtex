name: Auto Revert on Smoke Failure

# Fires when the CI workflow on `main` completes with a failing
# `smoke-prod` job. Opens a revert PR labeled `auto-revert` targeting
# the exact main commit whose smoke check failed. The Reviewer (Codex) merges the revert
# immediately — plan-present / scope-check are relaxed for PRs that
# carry the `auto-revert` label.
#
# Rule: still-broken production rolls back. If production recovered on the
# failed SHA, rerun the trusted GitHub smoke and fix forward for up to one hour.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  revert:
    name: Open revert PR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify smoke-prod was the failing job
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          failed=$(gh run view "$RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | .name')
          echo "failed jobs: $failed"
          if echo "$failed" | grep -qi "smoke"; then
            echo "trigger=true" >> "$GITHUB_OUTPUT"
          else
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "No smoke failure; skipping auto-revert."
          fi

      - name: Identify failed main commit
        if: steps.check.outputs.trigger == 'true'
        id: merge
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short "$sha")" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=format:%s "$sha")" >> "$GITHUB_OUTPUT"

      - name: Guard against revert loops
        if: steps.check.outputs.trigger == 'true'
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ steps.merge.outputs.sha }}
          SHORT: ${{ steps.merge.outputs.short }}
        run: |
          set -euo pipefail
          branch="auto-revert/${SHORT}"
          message=$(git log -1 --pretty=%B "$SHA")
          if [ "${HEAD_BRANCH#auto-revert/}" != "$HEAD_BRANCH" ] || echo "$message" | grep -Eiq '(^auto-revert:|auto-revert/)'; then
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "Failed commit is already an auto-revert; skipping."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "Auto-revert branch already exists for $SHORT; skipping."
            exit 0
          fi
          existing_pr=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // ""')
          if [ -n "$existing_pr" ]; then
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "Auto-revert PR #$existing_pr already exists for $SHORT; skipping."
            exit 0
          fi
          echo "trigger=true" >> "$GITHUB_OUTPUT"

      - name: Preflight auto-revert token
        if: steps.guard.outputs.trigger == 'true'
        id: token
        env:
          AUTO_REVERT_TOKEN: ${{ secrets.AUTO_REVERT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$AUTO_REVERT_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AUTO_REVERT_TOKEN is missing. Automatic rollback cannot open a PR if production remains unhealthy."
            {
              echo "## Auto-revert token preflight"
              echo ""
              echo "- AUTO_REVERT_TOKEN configured: \`false\`"
              echo "- Impact: if production does not recover on the failed SHA, this workflow will stop before opening a revert PR."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect production app release requirement
        if: steps.guard.outputs.trigger == 'true'
        id: app-release
        env:
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          before="$(git rev-parse "${SHA}^1" 2>/dev/null || true)"

          if [ -z "$before" ]; then
            echo "requires_app_release=true" >> "$GITHUB_OUTPUT"
            echo "Previous main commit is unknown; production app release match remains required."
            exit 0
          fi

          changed_files="$(git diff --name-only "$before" "$SHA")"
          echo "Changed files:"
          printf '%s\n' "$changed_files"

          requires_app_release=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              AGENTS.md|README.md|knip.jsonc|tsconfig.unused.json|docs/*|.github/*|.agents/*|.codex/*|apps/site/*)
                ;;
              *)
                requires_app_release=true
                ;;
            esac
          done <<< "$changed_files"

          echo "requires_app_release=$requires_app_release" >> "$GITHUB_OUTPUT"
          if [ "$requires_app_release" = "true" ]; then
            echo "Production app-affecting changes detected; recovery requires release match."
          else
            echo "Only docs, workflow, agent-guidance, cleanup-tooling config, or site-only files changed; recovery accepts healthy app smoke without release match."
          fi

      - name: Check current production health before reverting
        if: steps.guard.outputs.trigger == 'true'
        id: recovery
        env:
          APP_HEALTH_URL: https://app.corgtex.com/api/health
          SHA: ${{ steps.merge.outputs.sha }}
          REQUIRES_APP_RELEASE: ${{ steps.app-release.outputs.requires_app_release }}
        run: |
          set -euo pipefail
          attempts="${AUTO_REVERT_RECOVERY_HEALTH_ATTEMPTS:-12}"
          interval="${AUTO_REVERT_RECOVERY_HEALTH_INTERVAL_SECONDS:-10}"
          healthy_recovery="false"
          last_status="no response"
          last_body=""

          for i in $(seq 1 "$attempts"); do
            body_file="$(mktemp)"
            status="$(curl -L -sS --max-time 10 -w "%{http_code}" -o "$body_file" "$APP_HEALTH_URL" || true)"
            body="$(cat "$body_file" || true)"
            rm -f "$body_file"
            last_status="$status"
            last_body="$body"

            if [ "$status" = "200" ] && node -e '
              const body = process.argv[1];
              const sha = process.argv[2];
              const requiresAppRelease = process.argv[3] !== "false";
              try {
                const json = JSON.parse(body);
                const releaseGitSha = json?.release?.gitSha ?? "";
                const releaseImageTag = json?.release?.imageTag ?? "";
                const releaseMatches = !requiresAppRelease || releaseGitSha === sha || releaseImageTag === sha;
                const healthOk = json?.status === "ok" && json?.service === "web" &&
                  json?.database === "up" && json?.schema === "ready" &&
                  json?.app === "corgtex" && json?.auth === "password-session";
                process.exit(healthOk && releaseMatches ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' "$body" "$SHA" "$REQUIRES_APP_RELEASE"; then
              healthy_recovery="true"
              echo "Production health satisfies recovery criteria for failed SHA $SHA at attempt $i."
              break
            fi

            echo "Health attempt $i/$attempts did not satisfy recovery criteria for $SHA. status=$status"
            if [ "$i" -lt "$attempts" ]; then
              sleep "$interval"
            fi
          done

          echo "healthy=$healthy_recovery" >> "$GITHUB_OUTPUT"
          echo "status=$last_status" >> "$GITHUB_OUTPUT"
          {
            echo "## Auto-revert recovery probe"
            echo ""
            echo "- Failed run: ${{ github.event.workflow_run.html_url }}"
            echo "- Health URL: $APP_HEALTH_URL"
            echo "- Expected SHA: \`$SHA\`"
            echo "- App release match required: \`$REQUIRES_APP_RELEASE\`"
            echo "- Current health satisfies recovery criteria: \`$healthy_recovery\`"
            echo "- Last HTTP status: \`$last_status\`"
            echo ""
            if [ "$healthy_recovery" = "true" ]; then
              echo "Production recovered before auto-revert. Do not open an automatic revert PR from this run."
              echo "Rerun the trusted GitHub production smoke, then use the fix-forward window for up to one hour before rollback."
            else
              echo "Production did not recover on the failed SHA during the recovery probe. Proceeding to auto-revert."
              echo ""
              echo "\`\`\`json"
              printf '%s\n' "$last_body"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip revert for recovered production
        if: steps.guard.outputs.trigger == 'true' && steps.recovery.outputs.healthy == 'true'
        run: |
          echo "Production satisfies the recovery criteria. Skipping automatic revert so the trusted smoke can be rerun."

      - name: Verify auto-revert token is configured
        if: steps.guard.outputs.trigger == 'true' && steps.recovery.outputs.healthy != 'true'
        env:
          AUTO_REVERT_TOKEN: ${{ secrets.AUTO_REVERT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$AUTO_REVERT_TOKEN" ]; then
            echo "AUTO_REVERT_TOKEN is required so revert PR events trigger normal pull_request CI."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${AUTO_REVERT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Create revert branch
        if: steps.guard.outputs.trigger == 'true' && steps.recovery.outputs.healthy != 'true'
        env:
          SHA: ${{ steps.merge.outputs.sha }}
          SHORT: ${{ steps.merge.outputs.short }}
        run: |
          set -euo pipefail
          branch="auto-revert/${SHORT}"
          git config user.name "corgtex-auto-revert"
          git config user.email "auto-revert@corgtex.local"
          git checkout -b "$branch"
          # -m 1 handles merge commits; harmless on a non-merge commit.
          git revert --no-edit -m 1 "$SHA" || git revert --no-edit "$SHA"
          git push origin "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Open revert PR
        if: steps.guard.outputs.trigger == 'true' && steps.recovery.outputs.healthy != 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_REVERT_TOKEN }}
          SUBJECT: ${{ steps.merge.outputs.subject }}
          SHORT: ${{ steps.merge.outputs.short }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "auto-revert: ${SUBJECT} (${SHORT})" \
            --label auto-revert \
            --body "Production smoke test failed after the merge of \`${SHORT}\` (\"${SUBJECT}\"), and the current production health probe did not recover on that SHA. This PR reverts that change. Failed CI run: ${RUN_URL}"
