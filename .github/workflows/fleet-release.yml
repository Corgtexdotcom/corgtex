name: Fleet Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "latest-stable or a full 40-character Git SHA."
        required: true
        type: string
        default: latest-stable
      targets:
        description: "default, all, railway-customers, azure-selfserve, ops, backup-app, or a comma-separated subset. Default excludes backup-app."
        required: true
        type: string
        default: railway-customers,azure-selfserve,ops
      reason:
        description: "Audited reason for the release."
        required: true
        type: string
      dry_run:
        description: "Print the manifest, rings, and blockers without mutating providers."
        required: true
        type: boolean
        default: true
      concurrency:
        description: "Max targets promoted in parallel within a ring."
        required: true
        type: string
        default: "2"
      force_after_failure:
        description: "Continue later rings after a failed target."
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  id-token: write
  issues: write
  packages: read

concurrency:
  group: fleet-release
  cancel-in-progress: false

jobs:
  release:
    name: Promote Corgtex release
    runs-on: ubuntu-latest
    environment: fleet-release-production
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corgtex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corgtex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL || 'https://ops.corgtex.com' }}
      CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_GRAPHQL_ENDPOINT: ${{ vars.RAILWAY_GRAPHQL_ENDPOINT }}
      FLEET_RELEASE_TARGETS_JSON: ${{ vars.FLEET_RELEASE_TARGETS_JSON }}
      FLEET_RELEASE_OPS_TARGET_JSON: ${{ vars.FLEET_RELEASE_OPS_TARGET_JSON }}
      FLEET_RELEASE_BACKUP_APP_TARGET_JSON: ${{ vars.FLEET_RELEASE_BACKUP_APP_TARGET_JSON }}
      FLEET_RELEASE_AZURE_TARGET_JSON: ${{ vars.FLEET_RELEASE_AZURE_TARGET_JSON }}
      FLEET_RELEASE_STABLE_GIT_SHA: ${{ vars.FLEET_RELEASE_STABLE_GIT_SHA }}
      FLEET_RELEASE_ACR_SERVER: ${{ vars.FLEET_RELEASE_ACR_SERVER || 'acrcorgtexssstgwus3.azurecr.io' }}
      FLEET_RELEASE_POST_DEPLOY_PROBES: ${{ vars.FLEET_RELEASE_POST_DEPLOY_PROBES || 'true' }}
      FLEET_RELEASE_REQUIRE_REMOTE_SUPPORT_AUDIT: ${{ vars.FLEET_RELEASE_REQUIRE_REMOTE_SUPPORT_AUDIT || 'false' }}
      OPS_SLACK_WEBHOOK_URL: ${{ secrets.OPS_SLACK_WEBHOOK_URL }}
      OPS_GITHUB_REPOSITORY: ${{ vars.OPS_GITHUB_REPOSITORY || github.repository }}
      OPS_GITHUB_TOKEN: ${{ secrets.OPS_GITHUB_TOKEN || github.token }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corgtex_ci?schema=public
      ADMIN_EMAIL: system+corgtex@corgtex.local
      ADMIN_PASSWORD: corgtex-test-agent-pw
      GHCR_IMPORT_USERNAME: ${{ vars.GHCR_IMPORT_USERNAME || github.actor }}
      GHCR_IMPORT_TOKEN: ${{ secrets.GHCR_IMPORT_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
      POSTHOG_ENABLED: ${{ vars.POSTHOG_ENABLED }}
      POSTHOG_CAPTURE_KILL_SWITCH: ${{ vars.POSTHOG_CAPTURE_KILL_SWITCH || 'false' }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST || 'https://us.i.posthog.com' }}
      POSTHOG_ENVIRONMENT: ${{ vars.POSTHOG_ENVIRONMENT || 'production' }}
      POSTHOG_EVENT_SAMPLE_RATE: ${{ vars.POSTHOG_EVENT_SAMPLE_RATE || '1' }}
      POSTHOG_CAPTURE_TIMEOUT_MS: ${{ vars.POSTHOG_CAPTURE_TIMEOUT_MS || '1500' }}
      POSTHOG_CAPTURE_DEBUG: ${{ vars.POSTHOG_CAPTURE_DEBUG || 'false' }}
      POSTHOG_INSTANCE_ID: ${{ vars.POSTHOG_INSTANCE_ID || '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate release environment
        env:
          RELEASE_INPUT: ${{ inputs.release }}
          TARGETS_INPUT: ${{ inputs.targets }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          node scripts/release/fleet-release-runner.mjs validate-config \
            --release "$RELEASE_INPUT" \
            --targets "$TARGETS_INPUT" \
            --dry-run "$DRY_RUN_INPUT"

      - name: Resolve release manifest
        id: manifest
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          node scripts/release/fleet-release-runner.mjs resolve \
            --release "$RELEASE_INPUT"

      - name: Preflight fleet release
        if: ${{ !inputs.dry_run }}
        env:
          MANIFEST_JSON: ${{ steps.manifest.outputs.manifest_json }}
          TARGETS_INPUT: ${{ inputs.targets }}
          RELEASE_REASON: ${{ inputs.reason }}
          CONCURRENCY_INPUT: ${{ inputs.concurrency }}
        run: |
          node scripts/release/fleet-release-runner.mjs deploy \
            --manifest-json "$MANIFEST_JSON" \
            --targets "$TARGETS_INPUT" \
            --reason "$RELEASE_REASON" \
            --dry-run true \
            --concurrency "$CONCURRENCY_INPUT" \
            --fail-on-blockers true

      - name: Plan fleet release
        if: ${{ inputs.dry_run }}
        env:
          MANIFEST_JSON: ${{ steps.manifest.outputs.manifest_json }}
          TARGETS_INPUT: ${{ inputs.targets }}
          RELEASE_REASON: ${{ inputs.reason }}
          CONCURRENCY_INPUT: ${{ inputs.concurrency }}
        run: |
          node scripts/release/fleet-release-runner.mjs deploy \
            --manifest-json "$MANIFEST_JSON" \
            --targets "$TARGETS_INPUT" \
            --reason "$RELEASE_REASON" \
            --dry-run true \
            --concurrency "$CONCURRENCY_INPUT" \
            --fail-on-blockers true

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.manifest.outputs.git_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Validate data migration fixtures
        run: npm run check:migration-fixtures

      - name: Validate seed fixtures
        run: npm run check:seed-fixtures

      - name: Checkout release runner source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify release images exist
        if: ${{ !inputs.dry_run }}
        env:
          MANIFEST_JSON: ${{ steps.manifest.outputs.manifest_json }}
        run: |
          node scripts/release/fleet-release-runner.mjs check-images \
            --manifest-json "$MANIFEST_JSON"

      - name: Log in to Azure
        if: ${{ !inputs.dry_run && (inputs.targets == 'all' || contains(inputs.targets, 'azure-selfserve')) }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Promote release through rings
        if: ${{ !inputs.dry_run }}
        env:
          MANIFEST_JSON: ${{ steps.manifest.outputs.manifest_json }}
          TARGETS_INPUT: ${{ inputs.targets }}
          RELEASE_REASON: ${{ inputs.reason }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          CONCURRENCY_INPUT: ${{ inputs.concurrency }}
          FORCE_AFTER_FAILURE_INPUT: ${{ inputs.force_after_failure }}
        run: |
          node scripts/release/fleet-release-runner.mjs deploy \
            --manifest-json "$MANIFEST_JSON" \
            --targets "$TARGETS_INPUT" \
            --reason "$RELEASE_REASON" \
            --dry-run "$DRY_RUN_INPUT" \
            --concurrency "$CONCURRENCY_INPUT" \
            --force-after-failure "$FORCE_AFTER_FAILURE_INPUT"
