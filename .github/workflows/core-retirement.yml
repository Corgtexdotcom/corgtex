name: Retire Existing Core

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only preflight; execution requires a reviewed approval manifest and independent environment approval
        type: boolean
        required: true
        default: true
      approval_json:
        description: Exact retirement approval manifest independently reviewed with retained evidence before approving this run
        type: string
        required: false
      approval_sha256:
        description: Canonical SHA256 of approval_json; execute only
        type: string
        required: false
      reconcile_failed_run_id:
        description: Incident-bound reconciliation only for reviewed failed run 36883501899; never rerun an execution
        type: string
        required: false

      healthcheck_failed_run_id:
        description: Exact failed reconciliation 36892304659; dry-run plans its unchanged partial state before one reviewed healthcheck recovery
        type: string
        required: false

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: fleet-release
  cancel-in-progress: false

jobs:
  retire:
    name: Retire existing Core
    if: github.ref == 'refs/heads/main' && github.repository == 'Corgtexdotcom/corgtex'
    runs-on: ubuntu-latest
    environment: fleet-release-production
    timeout-minutes: 20
    steps:
      - name: Validate incident mode
        env:
          RECONCILE_RUN: ${{ inputs.reconcile_failed_run_id }}
          HEALTHCHECK_RUN: ${{ inputs.healthcheck_failed_run_id }}
        run: |
          node --input-type=module -e '
            const { RECONCILE_RUN: r, HEALTHCHECK_RUN: h } = process.env;
            if ((r && h) || (r && r !== "36883501899") || (h && h !== "36892304659")) process.exit(1);
          '
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
      - run: npm ci --ignore-scripts
      - name: Authenticate existing package reader
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_IMPORT_USERNAME }}
          password: ${{ secrets.GHCR_IMPORT_TOKEN }}
      - name: Verify retirement plan without mutations
        if: ${{ inputs.dry_run && inputs.healthcheck_failed_run_id == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          FLEET_RELEASE_BACKUP_APP_TARGET_JSON: ${{ vars.FLEET_RELEASE_BACKUP_APP_TARGET_JSON }}
        run: node scripts/release/core-retirement-runner.mjs plan
      # Persisted GitHub step state is the no-replay journal before any mutation.
      - name: Retire reviewed Core application execution
        if: ${{ !inputs.dry_run && inputs.reconcile_failed_run_id == '' && inputs.healthcheck_failed_run_id == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          FLEET_RELEASE_BACKUP_APP_TARGET_JSON: ${{ vars.FLEET_RELEASE_BACKUP_APP_TARGET_JSON }}
          CORE_RETIREMENT_APPROVAL_JSON: ${{ inputs.approval_json }}
          CORE_RETIREMENT_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
        run: node scripts/release/core-retirement-runner.mjs execute
      - name: Reconcile unchanged Core retirement incident
        if: ${{ !inputs.dry_run && inputs.reconcile_failed_run_id != '' && inputs.healthcheck_failed_run_id == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          FLEET_RELEASE_BACKUP_APP_TARGET_JSON: ${{ vars.FLEET_RELEASE_BACKUP_APP_TARGET_JSON }}
          CORE_RETIREMENT_APPROVAL_JSON: ${{ inputs.approval_json }}
          CORE_RETIREMENT_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
          CORE_RETIREMENT_RECONCILE_FAILED_RUN_ID: ${{ inputs.reconcile_failed_run_id }}
        run: node scripts/release/core-retirement-runner.mjs reconcile
      - name: Verify healthcheck recovery plan without mutations
        if: ${{ inputs.dry_run && inputs.healthcheck_failed_run_id != '' && inputs.reconcile_failed_run_id == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          FLEET_RELEASE_BACKUP_APP_TARGET_JSON: ${{ vars.FLEET_RELEASE_BACKUP_APP_TARGET_JSON }}
          CORE_RETIREMENT_HEALTHCHECK_FAILED_RUN_ID: ${{ inputs.healthcheck_failed_run_id }}
        run: node scripts/release/core-retirement-runner.mjs healthcheck-plan
      - name: Recover Core worker healthcheck retirement
        if: ${{ !inputs.dry_run && inputs.healthcheck_failed_run_id != '' && inputs.reconcile_failed_run_id == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          FLEET_RELEASE_BACKUP_APP_TARGET_JSON: ${{ vars.FLEET_RELEASE_BACKUP_APP_TARGET_JSON }}
          CORE_RETIREMENT_APPROVAL_JSON: ${{ inputs.approval_json }}
          CORE_RETIREMENT_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
          CORE_RETIREMENT_HEALTHCHECK_FAILED_RUN_ID: ${{ inputs.healthcheck_failed_run_id }}
        run: node scripts/release/core-retirement-runner.mjs healthcheck-recover
      - name: Retain retirement and uncertain-outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-retirement-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/core-retirement/*.json
          if-no-files-found: ignore
          retention-days: 90
