          fs.appendFileSync(process.env.GITHUB_ENV, `BASE_URL=${baseUrl.origin}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_GIT_SHA=${expectedGitSha}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CHECKED_OUT_GIT_SHA=${checkedOutGitSha}\n`);
          NODE

      - name: Check trusted workflow ref
        id: trusted_ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.validation-context.outputs.trusted_ref }}" = "true" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare validation artifact directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$CHECKED_OUT_GIT_SHA"
            echo "base_url=$BASE_URL"
            echo "workspace_slug=$WORKSPACE_SLUG"
            echo "pr_numbers=$PR_NUMBERS"
            echo "expected_git_sha=$EXPECTED_GIT_SHA"
          } > "$OUT_DIR/workflow.log"

      - name: Check production smoke credentials
        if: steps.trusted_ref.outputs.trusted == 'true'
        id: credentials
        shell: bash
        env:
          BRIEFING_FIXTURE_SMOKE_EMAIL: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          BRIEFING_FIXTURE_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$BRIEFING_FIXTURE_SMOKE_EMAIL" ] || [ -z "$BRIEFING_FIXTURE_SMOKE_PASSWORD" ] || [ -z "$DATABASE_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record blocked briefing fixture validation for untrusted ref
        if: steps.trusted_ref.outputs.trusted != 'true'
        run: |
          node scripts/production-validation-blocked.mjs \
            --out-dir="$OUT_DIR" \
            --base-url="$BASE_URL" \
            --tenant-slug="$WORKSPACE_SLUG" \
            --pr-numbers="$PR_NUMBERS" \
            --method="briefing-fixture-production-smoke" \
            --intent="Deterministic workspace briefing fixture proves ranking, recency, stale context, source labels, and dashboard display" \
            --blocker="Production briefing fixture validation with admin and database secrets must be dispatched from refs/heads/main."

      - name: Record blocked briefing fixture validation for missing credentials
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available != 'true'
        run: |
          node scripts/production-validation-blocked.mjs \
            --out-dir="$OUT_DIR" \
            --base-url="$BASE_URL" \
            --tenant-slug="$WORKSPACE_SLUG" \
            --pr-numbers="$PR_NUMBERS" \
            --method="briefing-fixture-production-smoke" \
            --intent="Deterministic workspace briefing fixture proves ranking, recency, stale context, source labels, and dashboard display" \
            --blocker="PRODUCTION_VALIDATION_ADMIN_EMAIL/PASSWORD or ADMIN_EMAIL/PASSWORD and PRODUCTION_DATABASE_URL production smoke secrets are required."

      - run: npm ci
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available == 'true'

      - name: Run briefing fixture production smoke
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/briefing-fixture-production-smoke.mjs "$BASE_URL" "$OUT_DIR" 2>&1 | tee "$OUT_DIR/briefing-fixture-production-smoke.log"
        env:
          BRIEFING_FIXTURE_SMOKE_EMAIL: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          BRIEFING_FIXTURE_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          BRIEFING_FIXTURE_SMOKE_WORKSPACE_SLUG: ${{ env.WORKSPACE_SLUG }}
          BRIEFING_FIXTURE_SMOKE_PR_NUMBERS: ${{ env.PR_NUMBERS }}
          BRIEFING_FIXTURE_SMOKE_EXPECTED_GIT_SHA: ${{ steps.validation_inputs.outputs.expected_git_sha }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Add validation report to summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$(find "$OUT_DIR" -maxdepth 1 -name '*.report.md' -print -quit 2>/dev/null || true)"
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No briefing fixture validation report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-validation-briefing-fixture
          path: .artifacts/production-validation/briefing-fixture
          if-no-files-found: warn

  recorder-readiness-production-smoke:
    name: Recorder Readiness Smoke
    needs: validation-context
    if: ${{ needs.validation-context.outputs.recorder_readiness_smoke == 'true' }}
    runs-on: ubuntu-latest
    environment: fleet-release-production
    timeout-minutes: 10
    env:
      OUT_DIR: .artifacts/production-validation/recorder-readiness
      PR_NUMBERS: ${{ needs.validation-context.outputs.pr_numbers }}
      DEPLOYMENTS: ${{ needs.validation-context.outputs.recorder_readiness_deployments }}
      CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL || 'https://ops.corgtex.com' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validation-context.outputs.trusted_ref == 'true' && (github.event.workflow_run.head_sha || github.sha) || 'main' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate production validation inputs
        id: validation_inputs
        shell: bash
        env:
          BASE_URL_INPUT: ${{ needs.validation-context.outputs.base_url }}
          EXPECTED_GIT_SHA_INPUT: ${{ needs.validation-context.outputs.expected_git_sha }}
          TRUSTED_REF_OUTPUT: ${{ needs.validation-context.outputs.trusted_ref }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");

          const baseUrlInput = String(process.env.BASE_URL_INPUT || "").trim();
          let baseUrl;
          try {
            baseUrl = new URL(baseUrlInput);
          } catch {
            throw new Error("base_url must be a valid URL.");
          }
          if (baseUrl.origin !== "https://app.corgtex.com" || !["", "/"].includes(baseUrl.pathname) || baseUrl.search || baseUrl.hash) {
            throw new Error("base_url must be exactly https://app.corgtex.com.");
          }

          const expectedGitSha = String(process.env.EXPECTED_GIT_SHA_INPUT || "").trim().toLowerCase();
          if (expectedGitSha && !/^[a-f0-9]{40}$/i.test(expectedGitSha)) {
            throw new Error("expected_git_sha must be a 40-character git SHA when provided.");
          }
          const checkedOutGitSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim().toLowerCase();
          if (!/^[a-f0-9]{40}$/i.test(checkedOutGitSha)) {
            throw new Error("checked-out git SHA must be a 40-character git SHA.");
          }
          if (expectedGitSha && process.env.TRUSTED_REF_OUTPUT === "true" && expectedGitSha !== checkedOutGitSha) {
            throw new Error(`recorder readiness smoke imports repository code and must run from the same revision expected in production; expected_git_sha=${expectedGitSha} checked_out_sha=${checkedOutGitSha}`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `base_url=${baseUrl.origin}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `expected_git_sha=${expectedGitSha}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `checked_out_git_sha=${checkedOutGitSha}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `BASE_URL=${baseUrl.origin}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_GIT_SHA=${expectedGitSha}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CHECKED_OUT_GIT_SHA=${checkedOutGitSha}\n`);
          NODE

      - name: Check trusted workflow ref
        id: trusted_ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.validation-context.outputs.trusted_ref }}" = "true" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare validation artifact directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$CHECKED_OUT_GIT_SHA"
            echo "base_url=$BASE_URL"
            echo "control_plane_url=$CONTROL_PLANE_URL"
            echo "deployments=$DEPLOYMENTS"
            echo "pr_numbers=$PR_NUMBERS"
            echo "expected_git_sha=$EXPECTED_GIT_SHA"
          } > "$OUT_DIR/workflow.log"

      - name: Check recorder readiness prerequisites
        if: steps.trusted_ref.outputs.trusted == 'true'
        id: credentials
        shell: bash
        env:
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CONTROL_PLANE_AGENT_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record blocked recorder readiness validation for untrusted ref
        if: steps.trusted_ref.outputs.trusted != 'true'
        run: |
          node scripts/production-validation-blocked.mjs \
            --out-dir="$OUT_DIR" \
            --base-url="$BASE_URL" \
            --tenant-slug="fleet-recorder-readiness" \
            --pr-numbers="$PR_NUMBERS" \
            --method="recorder-readiness-production-smoke" \
            --intent="Configured customer recorder readiness across control-plane, tenant config, vendor, calendar, meetings, and live proof gates" \
            --blocker="Production recorder readiness validation with control-plane credentials must be dispatched from refs/heads/main."

      - name: Record blocked recorder readiness validation for missing control-plane access
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available != 'true'
        run: |
          node scripts/production-validation-blocked.mjs \
            --out-dir="$OUT_DIR" \
            --base-url="$BASE_URL" \
            --tenant-slug="fleet-recorder-readiness" \
            --pr-numbers="$PR_NUMBERS" \
            --method="recorder-readiness-production-smoke" \
            --intent="Configured customer recorder readiness across control-plane, tenant config, vendor, calendar, meetings, and live proof gates" \
            --blocker="CONTROL_PLANE_AGENT_API_KEY production smoke secret is required for read-only recorder readiness."

      - run: npm ci
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available == 'true'

      - name: Run recorder readiness production smoke
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/recorder-readiness-production-smoke.mjs "$BASE_URL" "$OUT_DIR" 2>&1 | tee "$OUT_DIR/recorder-readiness-production-smoke.log"
        env:
          RECORDER_READINESS_SMOKE_DEPLOYMENTS: ${{ env.DEPLOYMENTS }}
          RECORDER_READINESS_SMOKE_PR_NUMBERS: ${{ env.PR_NUMBERS }}
          RECORDER_READINESS_SMOKE_EXPECTED_GIT_SHA: ${{ steps.validation_inputs.outputs.expected_git_sha }}
          CONTROL_PLANE_URL: ${{ env.CONTROL_PLANE_URL }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}

      - name: Add validation report to summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$(find "$OUT_DIR" -maxdepth 1 -name '*.report.md' -print -quit 2>/dev/null || true)"
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No recorder readiness validation report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-validation-recorder-readiness
          path: .artifacts/production-validation/recorder-readiness
          if-no-files-found: warn

  production-validation-outcome:
    name: Production Validation Outcome
    needs:
      - validation-context
      - telemetry-release-production-smoke
      - client-readiness-production-smoke
      - crm-production-smoke
      - source-intake-production-smoke
      - work-item-parity-production-smoke
      - briefing-fixture-production-smoke
      - recorder-readiness-production-smoke
    if: ${{ always() && needs.validation-context.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validation-context.outputs.trusted_ref == 'true' && (github.event.workflow_run.head_sha || github.sha) || 'main' }}

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: production-validation-*
          path: .artifacts/production-validation-collected

      - name: Fail on blocked or partial validation outcomes
        run: node scripts/production-validation-outcome-gate.mjs .artifacts/production-validation-collected
