name: Production Validation

on:
  workflow_call:
    inputs:
      validation_target:
        type: string
        required: true
    secrets:
      SELFSERVE_VALIDATION_EMAIL:
        required: false
      SELFSERVE_VALIDATION_PASSWORD:
        required: false
      SELFSERVE_SCHEMA_AUDITOR_URL:
        required: false
    outputs:
      target:
        value: ${{ jobs.validation-context.outputs.target }}
      smoke_proof:
        value: ${{ jobs.selfserve-outcome.outputs.available }}
      observation_since:
        value: ${{ jobs.validation-context.outputs.observation_since }}
      expected_git_sha:
        value: ${{ jobs.validation-context.outputs.expected_git_sha }}
  workflow_dispatch:
    inputs:
      selfserve_parity_smoke:
        description: Explicit internal-only work-item/MCP mutations and cleanup. Selfserve mode only; never automatic.
        type: boolean
        default: false
      selfserve_crm_smoke:
        description: Request real-model CRM qualification. Currently blocked until a fixed synthetic model lane is approved; never falls back to live first-account selection.
        type: boolean
        default: false
      base_url:
        description: Selfserve validation origin. Empty selects https://selfserve.corgtex.com.
        required: false
        default: ""
      expected_git_sha:
        description: Exact production release SHA required for explicit validation.
        required: false
        default: ""
      pr_numbers:
        description: Comma-separated PR numbers covered by this validation run.
        required: false
        default: ""
      client_readiness_routes:
        description: Comma-separated client-readiness route names to validate.
        required: false
        default: leads
  schedule:
    - cron: "47 10 * * *"

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  validation-context:
    name: Production Validation Context
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.context.outputs.target }}
      selfserve_parity_smoke: ${{ steps.context.outputs.selfserve_parity_smoke }}
      verifier_sha: ${{ steps.context.outputs.verifier_sha }}
      observation_since: ${{ steps.window.outputs.since }}
      enabled: ${{ steps.context.outputs.enabled }}
      trusted_ref: ${{ steps.context.outputs.trusted_ref }}
      base_url: ${{ steps.context.outputs.base_url }}
      expected_git_sha: ${{ steps.context.outputs.expected_git_sha }}
      pr_numbers: ${{ steps.context.outputs.pr_numbers }}
      client_readiness_routes: ${{ steps.context.outputs.client_readiness_routes }}
    steps:
      - id: window
        run: echo "since=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Resolve production validation context
        id: context
        shell: bash
        env:
          PRODUCTION_VALIDATION_TARGET: selfserve-validation
          PRODUCTION_VALIDATION_PINNED_TARGET: ${{ inputs.validation_target }}
          SELFSERVE_PARITY_INPUT: ${{ inputs.selfserve_parity_smoke }}
          SELFSERVE_CRM_INPUT: ${{ inputs.selfserve_crm_smoke }}
          SELFSERVE_VALIDATION_ACCEPTED_SHA: ${{ vars.SELFSERVE_VALIDATION_ACCEPTED_SHA }}
          PRODUCTION_VALIDATION_BASE_URL_INPUT: ${{ inputs.base_url || '' }}
          PRODUCTION_VALIDATION_EXPECTED_GIT_SHA_INPUT: ${{ inputs.expected_git_sha || '' }}
          PRODUCTION_VALIDATION_PR_NUMBERS_INPUT: ${{ inputs.pr_numbers || '' }}
          PRODUCTION_VALIDATION_CLIENT_READINESS_ROUTES_INPUT: ${{ inputs.client_readiness_routes || vars.PRODUCTION_VALIDATION_CLIENT_READINESS_ROUTES || 'leads' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/production-validation-context.mjs --output="$GITHUB_OUTPUT"

      - name: Add validation context to summary
        env:
          TARGET: ${{ steps.context.outputs.target }}
          EXPECTED_SHA: ${{ steps.context.outputs.expected_git_sha }}
          PR_NUMBERS: ${{ steps.context.outputs.pr_numbers }}
        run: |
          {
            printf '## Production Validation Context\n\n'
            printf -- '- Target: %s\n' "$TARGET"
            printf -- '- Expected SHA: %s\n' "$EXPECTED_SHA"
            printf -- '- PR numbers: %s\n' "$PR_NUMBERS"
          } >> "$GITHUB_STEP_SUMMARY"

  selfserve-live:
    name: Selfserve Named Owner Read-only Acceptance
    needs: [validation-context, selfserve-isolated]
    if: needs.validation-context.outputs.target == 'selfserve-validation' && needs.validation-context.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: fleet-release-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validation-context.outputs.verifier_sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validation-context.outputs.expected_git_sha }}
          path: .accepted-source
          persist-credentials: false
          fetch-depth: 0
      - name: Require accepted/release source on trusted main ancestry
        run: git -C .accepted-source merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: .accepted-source
      - run: node node_modules/prisma/build/index.js generate
        working-directory: .accepted-source
      - run: npx playwright install --with-deps chromium
      - name: Download expected catalog from this run's successful isolation
        uses: actions/download-artifact@v4
        with:
          name: selfserve-validation-isolated
          path: .artifacts/selfserve-catalog
      - name: Exact named-target health, login, session, ownership and navigation
        env:
          SELFSERVE_VALIDATION_EXPECTED_SHA: ${{ needs.validation-context.outputs.expected_git_sha }}
          SELFSERVE_VALIDATION_EMAIL: ${{ secrets.SELFSERVE_VALIDATION_EMAIL }}
          SELFSERVE_VALIDATION_PASSWORD: ${{ secrets.SELFSERVE_VALIDATION_PASSWORD }}
        run: node scripts/selfserve-validation-smoke.mjs
      - name: Actual read-only schema and migration checksum verification
        env:
          SELFSERVE_VALIDATION_EXPECTED_SHA: ${{ needs.validation-context.outputs.expected_git_sha }}
          SELFSERVE_SCHEMA_AUDITOR_URL: ${{ secrets.SELFSERVE_SCHEMA_AUDITOR_URL }}
          SELFSERVE_DATABASE_IDENTITY_SHA256: ${{ vars.SELFSERVE_DATABASE_IDENTITY_SHA256 }}
        run: node scripts/selfserve-validation-schema.mjs
      - name: Existing desktop/mobile navigation helper with closed target and read-only browser transport
        env:
          PRODUCTION_VALIDATION_TARGET: selfserve-validation
          SELFSERVE_VALIDATION_EXPECTED_SHA: ${{ needs.validation-context.outputs.expected_git_sha }}
          SELFSERVE_VALIDATION_EMAIL: ${{ secrets.SELFSERVE_VALIDATION_EMAIL }}
          SELFSERVE_VALIDATION_PASSWORD: ${{ secrets.SELFSERVE_VALIDATION_PASSWORD }}
          CLIENT_READINESS_WORKSPACE_ID: b1702569-4f4f-4d37-a008-da4d0e8c5742
          CLIENT_READINESS_WORKSPACE_SLUG: corgtex-validation
          CLIENT_READINESS_ROUTE_NAMES: ${{ needs.validation-context.outputs.client_readiness_routes }}
        run: node scripts/selfserve-validation-navigation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfserve-validation-live
          path: .artifacts/selfserve-validation
          if-no-files-found: error

  selfserve-isolated:
    name: Selfserve Isolated Full Source Intake and Briefing
    needs: validation-context
    if: needs.validation-context.outputs.target == 'selfserve-validation' && needs.validation-context.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    # Preparation may read immutable registry images using existing read access.
    # Only the repo's short-lived package-read token enters the preparation step.
    env:
      SELFSERVE_VALIDATION_EXPECTED_SHA: ${{ needs.validation-context.outputs.expected_git_sha }}
      SELFSERVE_ISOLATED_WEB_IMAGE: ${{ vars.SELFSERVE_ISOLATED_WEB_IMAGE }}
      SELFSERVE_ISOLATED_BROWSER_IMAGE: ${{ vars.SELFSERVE_ISOLATED_BROWSER_IMAGE }}
      SELFSERVE_ISOLATED_PG_IMAGE: ${{ vars.SELFSERVE_ISOLATED_PG_IMAGE }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validation-context.outputs.verifier_sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validation-context.outputs.expected_git_sha }}
          path: .accepted-source
          persist-credentials: false
          fetch-depth: 0
      - name: Require accepted/release source on trusted main ancestry
        run: git -C .accepted-source merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Stage exact immutable images before isolated runtime (existing read access only)
        timeout-minutes: 10
        env:
          SELFSERVE_IMAGE_READ_ACTOR: ${{ github.actor }}
          SELFSERVE_IMAGE_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/selfserve-validation-isolated.mjs --prepare
      - run: npm ci --ignore-scripts
        working-directory: .accepted-source
      - run: node node_modules/prisma/build/index.js generate
        working-directory: .accepted-source
      - name: Isolated full checks, bounded cleanup, no external network or production DB
        timeout-minutes: 30
        run: node scripts/selfserve-validation-isolated.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfserve-validation-isolated
          path: .artifacts/selfserve-isolated
          if-no-files-found: error

  selfserve-parity:
    name: Explicit Internal-only Work-item Parity
    needs: [validation-context, selfserve-live, selfserve-isolated]
    if: needs.validation-context.outputs.selfserve_parity_smoke == 'true'
    runs-on: ubuntu-latest
    environment: fleet-release-production
    timeout-minutes: 15
    concurrency:
      group: production-validation-work-item-parity-corgtex-validation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validation-context.outputs.verifier_sha }}
          persist-credentials: false
      - name: Guard owner/target before scoped internal mutations and verify cleanup
        env:
          SELFSERVE_PARITY_ENABLED: "true"
          SELFSERVE_VALIDATION_EXPECTED_SHA: ${{ needs.validation-context.outputs.expected_git_sha }}
          SELFSERVE_VALIDATION_EMAIL: ${{ secrets.SELFSERVE_VALIDATION_EMAIL }}
          SELFSERVE_VALIDATION_PASSWORD: ${{ secrets.SELFSERVE_VALIDATION_PASSWORD }}
        run: node scripts/selfserve-validation-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfserve-validation-parity
          path: .artifacts/selfserve-parity
          if-no-files-found: error

  selfserve-outcome:
    name: Selfserve Required Evidence Outcome
    needs: [validation-context, selfserve-live, selfserve-isolated, selfserve-parity]
    if: always() && needs.validation-context.outputs.target == 'selfserve-validation' && needs.validation-context.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.proof.outputs.available }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validation-context.outputs.verifier_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: selfserve-validation-*
          path: .artifacts/selfserve-validation-collected
      - name: Require every live and isolated receipt from this exact run/version
        env:
          SELFSERVE_VALIDATION_EXPECTED_SHA: ${{ needs.validation-context.outputs.expected_git_sha }}
          SELFSERVE_LIVE_RESULT: ${{ needs.selfserve-live.result }}
          SELFSERVE_ISOLATED_RESULT: ${{ needs.selfserve-isolated.result }}
          SELFSERVE_PARITY_ENABLED: ${{ needs.validation-context.outputs.selfserve_parity_smoke }}
          SELFSERVE_PARITY_RESULT: ${{ needs.selfserve-parity.result }}
        run: node scripts/selfserve-validation-outcome.mjs
      - id: proof
        run: echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfserve-validation-outcome
          path: .artifacts/selfserve-validation-outcome/outcome.json
          if-no-files-found: error
