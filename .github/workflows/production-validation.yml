          node scripts/source-intake-production-smoke.mjs "$BASE_URL" "$OUT_DIR" 2>&1 | tee "$OUT_DIR/source-intake-production-smoke.log"
        env:
          SOURCE_INTAKE_SMOKE_EMAIL: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          SOURCE_INTAKE_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          SOURCE_INTAKE_SMOKE_WORKSPACE_SLUG: ${{ env.WORKSPACE_SLUG }}
          SOURCE_INTAKE_SMOKE_PR_NUMBERS: ${{ env.PR_NUMBERS }}
          SOURCE_INTAKE_SMOKE_EXPECTED_GIT_SHA: ${{ steps.validation_inputs.outputs.expected_git_sha }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Add validation report to summary
