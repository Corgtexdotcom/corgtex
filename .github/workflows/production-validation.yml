name: Production Validation

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production app base URL.
        required: true
        default: https://app.corgtex.com
      expected_git_sha:
        description: Expected production release SHA. Defaults to the workflow ref SHA.
        required: false
        default: ""
      pr_numbers:
        description: Comma-separated PR numbers covered by this validation run.
        required: false
        default: ""
      crm_smoke:
        description: Run the CRM pending-operation production smoke.
        required: true
        type: boolean
        default: true
      source_intake_smoke:
        description: Run the Add/source-intake production smoke.
        required: true
        type: boolean
        default: true
      work_item_parity_smoke:
        description: Run the work-item parity production smoke.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  crm-production-smoke:
    name: CRM Pending-Operation Smoke
    if: ${{ inputs.crm_smoke }}
    runs-on: ubuntu-latest
    environment: fleet-release-production
    timeout-minutes: 25
    env:
      OUT_DIR: .artifacts/production-validation/crm
      PR_NUMBERS: ${{ inputs.pr_numbers }}
      WORKSPACE_SLUG: corgtex-validation
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate production validation inputs
        id: validation_inputs
        shell: bash
        env:
          BASE_URL_INPUT: ${{ inputs.base_url }}
          EXPECTED_GIT_SHA_INPUT: ${{ inputs.expected_git_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const baseUrlInput = String(process.env.BASE_URL_INPUT || "").trim();
          let baseUrl;
          try {
            baseUrl = new URL(baseUrlInput);
          } catch {
            throw new Error("base_url must be a valid URL.");
          }
          if (baseUrl.origin !== "https://app.corgtex.com" || !["", "/"].includes(baseUrl.pathname) || baseUrl.search || baseUrl.hash) {
            throw new Error("base_url must be exactly https://app.corgtex.com.");
          }

          const expectedInput = String(process.env.EXPECTED_GIT_SHA_INPUT || "").trim();
          const expectedGitSha = expectedInput || process.env.GITHUB_SHA;
          if (!/^[a-f0-9]{40}$/i.test(expectedGitSha || "")) {
            throw new Error("expected_git_sha must be a 40-character git SHA when provided.");
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `base_url=${baseUrl.origin}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `expected_git_sha=${expectedGitSha.toLowerCase()}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `BASE_URL=${baseUrl.origin}\n`);
          NODE

      - name: Check trusted workflow ref
        id: trusted_ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare validation artifact directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "base_url=$BASE_URL"
            echo "workspace_slug=$WORKSPACE_SLUG"
            echo "pr_numbers=$PR_NUMBERS"
            echo "expected_git_sha=${{ steps.validation_inputs.outputs.expected_git_sha }}"
          } > "$OUT_DIR/workflow.log"

      - name: Check production smoke credentials
        if: steps.trusted_ref.outputs.trusted == 'true'
        id: credentials
        shell: bash
        env:
          CRM_SMOKE_EMAIL: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          CRM_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CRM_SMOKE_EMAIL" ] || [ -z "$CRM_SMOKE_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record blocked CRM validation for untrusted ref
        if: steps.trusted_ref.outputs.trusted != 'true'
        run: |
          node scripts/production-validation-blocked.mjs \
            --out-dir="$OUT_DIR" \
            --base-url="$BASE_URL" \
            --tenant-slug="$WORKSPACE_SLUG" \
            --pr-numbers="$PR_NUMBERS" \
            --method="crm-production-smoke" \
            --intent="CRM pages, MCP reads, chat context, and safe writeback" \
            --blocker="Production CRM validation with admin secrets must be dispatched from refs/heads/main."

      - name: Record blocked CRM validation for missing credentials
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available != 'true'
        run: |
          node scripts/production-validation-blocked.mjs \
            --out-dir="$OUT_DIR" \
            --base-url="$BASE_URL" \
            --tenant-slug="$WORKSPACE_SLUG" \
            --pr-numbers="$PR_NUMBERS" \
            --method="crm-production-smoke" \
            --intent="CRM pages, MCP reads, chat context, and safe writeback" \
            --blocker="PRODUCTION_VALIDATION_ADMIN_EMAIL/PASSWORD or ADMIN_EMAIL/PASSWORD production smoke secrets are required."

      - run: npm ci
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available == 'true'

      - name: Install browser runtime
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run CRM pending-operation production smoke
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/crm-production-smoke.mjs "$BASE_URL" "$OUT_DIR" 2>&1 | tee "$OUT_DIR/crm-production-smoke.log"
        env:
          CRM_SMOKE_EMAIL: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          CRM_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          CRM_SMOKE_WORKSPACE_SLUG: ${{ env.WORKSPACE_SLUG }}
          CRM_SMOKE_PR_NUMBERS: ${{ env.PR_NUMBERS }}
          CRM_SMOKE_EXPECTED_GIT_SHA: ${{ steps.validation_inputs.outputs.expected_git_sha }}

      - name: Add validation report to summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$(find "$OUT_DIR" -maxdepth 1 -name '*.report.md' -print -quit 2>/dev/null || true)"
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No CRM validation report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-validation-crm
          path: .artifacts/production-validation/crm
          if-no-files-found: warn

  source-intake-production-smoke:
    name: Source Intake Contract Smoke
