          } > "$OUT_DIR/workflow.log"

      - name: Check production smoke credentials
        if: steps.trusted_ref.outputs.trusted == 'true'
        id: credentials
        shell: bash
        env:
          SOURCE_INTAKE_SMOKE_EMAIL: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          SOURCE_INTAKE_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_INTAKE_SMOKE_EMAIL" ] || [ -z "$SOURCE_INTAKE_SMOKE_PASSWORD" ] || [ -z "$DATABASE_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record blocked source-intake validation for untrusted ref
        if: steps.trusted_ref.outputs.trusted != 'true'
        run: |
          node scripts/production-validation-blocked.mjs \
            --out-dir="$OUT_DIR" \
            --base-url="$BASE_URL" \
            --tenant-slug="$WORKSPACE_SLUG" \
            --pr-numbers="$PR_NUMBERS" \
            --method="source-intake-production-smoke" \
            --intent="Add/source-intake route contract, demo guard, internal validation write, mobile render, and cleanup" \
            --blocker="Production source-intake validation with admin secrets must be dispatched from refs/heads/main."

      - name: Record blocked source-intake validation for missing credentials
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available != 'true'
        run: |
          node scripts/production-validation-blocked.mjs \
            --out-dir="$OUT_DIR" \
            --base-url="$BASE_URL" \
            --tenant-slug="$WORKSPACE_SLUG" \
            --pr-numbers="$PR_NUMBERS" \
            --method="source-intake-production-smoke" \
            --intent="Add/source-intake route contract, demo guard, internal validation write, mobile render, and cleanup" \
            --blocker="PRODUCTION_VALIDATION_ADMIN_EMAIL/PASSWORD or ADMIN_EMAIL/PASSWORD and PRODUCTION_DATABASE_URL production smoke secrets are required."

      - run: npm ci
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available == 'true'

      - name: Install browser runtime
        if: steps.trusted_ref.outputs.trusted == 'true' && steps.credentials.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

