name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-scope:
    name: Synthetic Preparation Scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect synthetic harness and strict dependencies
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          # Compare the tested merge tree with its base, including deletions.
          status=0
          git diff --quiet "$BASE_SHA" HEAD -- \
            .github/workflows/ci.yml \
            .github/workflows/azure-migration-postgres-rehearsal.yml \
            'scripts/migration/*synthetic*' \
            'scripts/migration/*ops-azure-target*' \
            'scripts/migration/*postgres*' \
            'scripts/migration/validate-azure-what-if*' \
            infra/azure/migration-foundation \
            package.json package-lock.json .npmrc 'vitest*' || status=$?
          case "$status" in
            0) echo 'changed=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'changed=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  synthetic-preparation:
    name: Synthetic Native ARM64 Preparation
    needs: synthetic-scope
    if: github.event_name == 'pull_request' && needs.synthetic-scope.outputs.changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Set isolated runner-local paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'LOCAL_BUNDLE=%s/synthetic-public-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'LOCAL_EVIDENCE=%s/synthetic-proof-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install locked dependencies without lifecycle scripts
        timeout-minutes: 5
        run: npm ci --ignore-scripts
      - name: Download PUBLIC audited fixed-hash synthetic inputs
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$LOCAL_BUNDLE"
          for asset in source-image.tar synthetic.dump corpus.sql source-baseline.json; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 60 --max-filesize 268435456 \
              "https://github.com/Corgtexdotcom/corgtex/releases/download/ops-synthetic-source-v1/$asset" \
              --output "$LOCAL_BUNDLE/$asset"
          done
          node --input-type=module -e 'import { verifyBundle } from "./scripts/migration/synthetic-ops-source.mjs"; verifyBundle(process.env.LOCAL_BUNDLE);'
      - name: Cache pinned official PostgreSQL client
        timeout-minutes: 3
        run: docker pull postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
      - name: Exercise native local source and actual client transport
        timeout-minutes: 13
        run: node scripts/migration/prepare-synthetic-ops-local.mjs prepare "$LOCAL_BUNDLE" "$LOCAL_EVIDENCE"
      - name: Retry owned local cleanup
        if: always() && env.LOCAL_EVIDENCE != ''
        timeout-minutes: 2
        run: node scripts/migration/prepare-synthetic-ops-local.mjs cleanup "$LOCAL_EVIDENCE"
      # Missing summary after cancellation is UNPROVEN, never cleanup success.
      # Full local ownership/TLS/source receipts and payloads are not uploaded.
      - name: Retain sanitized local preparation summary
        if: always() && env.LOCAL_EVIDENCE != ''
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-native-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LOCAL_EVIDENCE }}/public-summary.json
          if-no-files-found: error
          retention-days: 7

  # Keep the PR and merge-queue gate comprehensive, but do not serialize
  # independent checks. This preserves the existing required check names while
  # letting test, migration, and build failures surface in parallel.
  check:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corgtex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corgtex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corgtex_test?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run prisma:validate

      - run: npm run check:private-boundary

      - run: npx prisma migrate deploy

      - run: npx vitest run --project unit --project integration

      - name: Test guarded validation owner adoption
        run: node --test scripts/adopt-validation-support-owner.integration.test.mjs
        env:
          QA_OWNER_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Test read-only schema auditor relation privileges
        run: node --test scripts/selfserve-validation-schema.integration.test.mjs scripts/selfserve-schema-catalog.integration.test.mjs
        env:
          QA_SCHEMA_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Test Azure site image release
        run: node --test scripts/azure-site-image-release.node-test.mjs

      - name: Test Ops and Core migration custody, fences and retained restore
        timeout-minutes: 15
        run: npm run test:migration:ops-core

      - name: Install PostgreSQL capture client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16

      - name: Test isolated tenant transfer
        run: npm run test:tenant-transfer

  db-sync:
    name: Database Sync
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corgtex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corgtex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corgtex_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      ADMIN_EMAIL: system+corgtex@corgtex.local
      ADMIN_PASSWORD: corgtex-test-agent-pw

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - run: npx prisma migrate deploy

      - run: npm run check:migration-fixtures

      - run: npm run check:seed-fixtures

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: env -u DATABASE_URL -u SHADOW_DATABASE_URL npm run build

      - run: npm run build:site

  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/check-public-docs.mjs
      - run: node scripts/check-private-boundary.mjs
      - run: npm i -g mint@4.2.717
      - run: mint validate
        working-directory: docs
      - run: mint broken-links
        working-directory: docs

  pr-policy:
    name: PR Policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Verify PR contract
        if: github.event_name == 'pull_request'
        run: node scripts/check-plan.mjs --mode=present
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Verify declared scope
        if: github.event_name == 'pull_request'
        run: node scripts/check-plan.mjs --mode=scope
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Verify agent policy checks
        if: github.event_name == 'pull_request'
        run: node scripts/check-plan.mjs --mode=policy
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Merge queue policy gate
        if: github.event_name == 'merge_group'
        run: echo "PR Policy passed on pull_request before merge queue entry."

  # Temporary required-check aliases. Remove after branch protection requires
  # `PR Policy` instead of these three legacy context names.
  plan-present-compat:
    name: Plan Present
    needs: pr-policy
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.pr-policy.result }}" = "success"

  scope-check-compat:
    name: Scope Check
    needs: pr-policy
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.pr-policy.result }}" = "success"

  diff-size-compat:
    name: Diff Size
    needs: pr-policy
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.pr-policy.result }}" = "success"

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Install gitleaks
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --redact --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Merge queue secret-scan gate
        if: github.event_name == 'merge_group'
        run: echo "Secret Scan passed on pull_request before merge queue entry."

  client-data-scan:
    name: Client Data Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Scan for client data leaks
        if: github.event_name == 'pull_request'
        run: node scripts/check-client-data-leak.mjs
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
      - name: Merge queue client-data gate
        if: github.event_name == 'merge_group'
        run: echo "Client Data Scan passed on pull_request before merge queue entry."

  smoke-target:
    name: Pin Production Validation Target
    needs: [check, db-sync, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository == 'Corgtexdotcom/corgtex'
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - id: target
        env:
          TARGET: ${{ vars.PRODUCTION_VALIDATION_TARGET || 'core' }}
        run: |
          case "$TARGET" in core|selfserve-validation) ;; *) exit 1 ;; esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

  smoke-prod:
    name: Production Smoke Test
    if: needs.smoke-target.outputs.target == 'core'
    environment: fleet-release-production
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    needs:
      - smoke-target
      - check
      - db-sync
      - build
    outputs:
      smoke_proof: ${{ steps.smoke-proof.outputs.available }}
      skip_release_match: ${{ steps.app-release.outputs.skip_release_match }}
      observation_since: ${{ steps.observation-window.outputs.since }}
      baseline_enabled: ${{ steps.baseline.outputs.enabled }}
      baseline_source_sha: ${{ steps.baseline.outputs.source_sha }}
      baseline_receipt_sha256: ${{ steps.baseline.outputs.receipt_sha256 }}
    steps:
      - name: Non-production smoke gate
        if: github.ref != 'refs/heads/main'
        run: echo "Production smoke runs after main deployment; required check is satisfied for PR and merge queue."

      - name: Skip if secrets not configured
        if: github.ref == 'refs/heads/main'
        id: check-secrets
        run: |
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ] || [ -z "${{ secrets.ADMIN_EMAIL }}" ] || [ -z "${{ secrets.ADMIN_PASSWORD }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Smoke test skipped — secrets not configured"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark observation window start
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        id: observation-window
        shell: bash
        run: echo "since=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve reviewed accepted Core baseline (absent config keeps legacy policy)
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/accepted-core-baseline.mjs resolve

      - name: Require credentials for configured baseline
        if: steps.baseline.outputs.enabled == 'true' && steps.check-secrets.outputs.skip == 'true'
        run: exit 1

      - uses: actions/checkout@v5
        if: steps.baseline.outputs.enabled == 'true'
        with:
          ref: ${{ steps.baseline.outputs.verifier_sha }}
          path: .baseline/verifier
          persist-credentials: false
      - uses: actions/checkout@v5
        if: steps.baseline.outputs.enabled == 'true'
        with:
          ref: ${{ steps.baseline.outputs.source_sha }}
          path: .baseline/source
          persist-credentials: false

      - uses: actions/setup-node@v5
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true' && steps.baseline.outputs.enabled != 'true'

      - run: npm ci --ignore-scripts
        if: steps.baseline.outputs.enabled == 'true'
        working-directory: .baseline/verifier
      - run: npm ci --ignore-scripts
        if: steps.baseline.outputs.enabled == 'true'
        working-directory: .baseline/source
      - run: node node_modules/prisma/build/index.js generate
        if: steps.baseline.outputs.enabled == 'true'
        working-directory: .baseline/source
      - run: node node_modules/prisma/build/index.js migrate diff --from-schema-datamodel prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
        if: steps.baseline.outputs.enabled == 'true'
        working-directory: .baseline/source

      - run: npx prisma generate
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true' && steps.baseline.outputs.enabled != 'true'

      - name: Wait for healthy self-serve deployment
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        run: node scripts/wait-health.mjs https://selfserve.corgtex.com/api/health --label self-serve

      - name: Wait for healthy backup app deployment
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        run: node scripts/wait-health.mjs https://app.corgtex.com/api/health --label backup-app

      - name: Detect production app release requirement
        id: app-release
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        env:
          RELEASE_CONTEXT_BEFORE: ${{ github.event.before }}
          RELEASE_CONTEXT_AFTER: ${{ github.sha }}
          RELEASE_CONTEXT_PATH: .artifacts/production-app-release-context/release-context.json
          ACCEPTED_CORE_BASELINE: ${{ steps.baseline.outputs.enabled }}
          ACCEPTED_CORE_SOURCE_SHA: ${{ steps.baseline.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/production-app-release-context
          node scripts/production-validation-context.mjs --classify-app-release --output="$GITHUB_OUTPUT"

      - name: Upload production app release context
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-app-release-context
          path: .artifacts/production-app-release-context/release-context.json
          if-no-files-found: error

      - run: node scripts/self-serve-production-readiness.mjs --base-url=https://selfserve.corgtex.com
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
      - run: node scripts/railway-smoke.mjs https://app.corgtex.com ${{ secrets.ADMIN_EMAIL }} ${{ secrets.ADMIN_PASSWORD }}
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true' && steps.baseline.outputs.enabled != 'true'
        env:
          CORGTEX_SKIP_RELEASE_MATCH: ${{ steps.app-release.outputs.skip_release_match }}
          CORGTEX_RELEASE_MATCH_TIMEOUT_MS: 1200000

      - name: Verify accepted Core provider, health, auth and schema using pinned verifier and source
        if: steps.baseline.outputs.enabled == 'true'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          FLEET_RELEASE_BACKUP_APP_TARGET_JSON: ${{ vars.FLEET_RELEASE_BACKUP_APP_TARGET_JSON }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node .baseline/verifier/scripts/accepted-core-baseline.mjs check

      - name: Retain sanitized Core baseline authentication proof
        if: steps.baseline.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-baseline-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/core-baseline/auth-smoke.json
          if-no-files-found: error
          retention-days: 90

      # Controlled rollout owns production migrations. Wait for its exact
      # release before read-only DB verification; never bootstrap from CI.
      - name: Verify bundled production migrations
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true' && steps.baseline.outputs.enabled != 'true'
        run: node --input-type=module -e 'import { verifyMigrations } from "./scripts/start-web.mjs"; await verifyMigrations();'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - run: node scripts/check-migration-health.mjs
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true' && steps.baseline.outputs.enabled != 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Mark production smoke proof available
        id: smoke-proof
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        run: echo "available=true" >> "$GITHUB_OUTPUT"

  smoke-selfserve:
    name: Selfserve Validation
    needs: [smoke-target, check, db-sync, build]
    if: needs.smoke-target.outputs.target == 'selfserve-validation'
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/production-validation.yml
    with:
      validation_target: ${{ needs.smoke-target.outputs.target }}
    secrets:
      SELFSERVE_VALIDATION_EMAIL: ${{ secrets.SELFSERVE_VALIDATION_EMAIL }}
      SELFSERVE_VALIDATION_PASSWORD: ${{ secrets.SELFSERVE_VALIDATION_PASSWORD }}
      SELFSERVE_SCHEMA_AUDITOR_URL: ${{ secrets.SELFSERVE_SCHEMA_AUDITOR_URL }}

  smoke-mode-gate:
    name: Production Validation Mode Gate
    needs: [smoke-target, smoke-prod, smoke-selfserve]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository == 'Corgtexdotcom/corgtex'
    runs-on: ubuntu-latest
    outputs:
      smoke_proof: ${{ needs.smoke-prod.outputs.smoke_proof || needs.smoke-selfserve.outputs.smoke_proof }}
      skip_release_match: ${{ needs.smoke-prod.outputs.skip_release_match || 'true' }}
      observation_since: ${{ needs.smoke-prod.outputs.observation_since || needs.smoke-selfserve.outputs.observation_since }}
      baseline_enabled: ${{ needs.smoke-prod.outputs.baseline_enabled }}
      baseline_source_sha: ${{ needs.smoke-prod.outputs.baseline_source_sha }}
      baseline_receipt_sha256: ${{ needs.smoke-prod.outputs.baseline_receipt_sha256 }}
      selfserve_expected_sha: ${{ needs.smoke-selfserve.outputs.expected_git_sha }}
      selected_target: ${{ steps.mode.outputs.selected_target }}
    steps:
      - name: Require the selected mode; unknown targets fail closed
        id: mode
        env:
          TARGET: ${{ needs.smoke-target.outputs.target }}
          CORE_RESULT: ${{ needs.smoke-prod.result }}
          SELFSERVE_RESULT: ${{ needs.smoke-selfserve.result }}
          SELFSERVE_PROOF: ${{ needs.smoke-selfserve.outputs.smoke_proof }}
          SELFSERVE_TARGET: ${{ needs.smoke-selfserve.outputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            core) test "$CORE_RESULT" = success && test "$SELFSERVE_RESULT" = skipped || exit 1 ;;
            selfserve-validation) test "$SELFSERVE_RESULT" = success && test "$SELFSERVE_PROOF" = true && test "$CORE_RESULT" = skipped && test "$SELFSERVE_TARGET" = "$TARGET" || exit 1 ;;
            *) exit 1 ;;
          esac
          echo "selected_target=$TARGET" >> "$GITHUB_OUTPUT"

  observe-prod:
    name: Post-deploy Observation Gate
    runs-on: ubuntu-latest
    needs:
      - smoke-prod
      - smoke-mode-gate
    if: always() && github.ref == 'refs/heads/main' && needs.smoke-mode-gate.result == 'success' && needs.smoke-mode-gate.outputs.smoke_proof == 'true'
    environment: fleet-release-production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_APPLICATIONINSIGHTS_APP_NAME: ${{ vars.AZURE_APPLICATIONINSIGHTS_APP_NAME || 'appi-corgtex-ss-prod' }}
      AZURE_APPLICATIONINSIGHTS_RESOURCE_GROUP: ${{ vars.AZURE_APPLICATIONINSIGHTS_RESOURCE_GROUP || 'rg-corgtex-selfserve-production-wus3' }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY || secrets.POSTHOG_QUERY_API_KEY }}
      POSTHOG_QUERY_API_HOST: ${{ vars.POSTHOG_QUERY_API_HOST }}
      POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST || 'https://us.i.posthog.com' }}
      GITHUB_TOKEN: ${{ github.token }}
      OPS_GITHUB_REPOSITORY: ${{ github.repository }}
      OBSERVATION_REQUIRE_SOURCE: "true"
      OBSERVATION_WINDOW_MINUTES: ${{ vars.OBSERVATION_WINDOW_MINUTES || '20' }}
      OBSERVATION_SINCE: ${{ needs.smoke-mode-gate.outputs.observation_since }}
      SMOKE_SKIP_RELEASE_MATCH: ${{ needs.smoke-mode-gate.outputs.skip_release_match }}
      PRODUCTION_VALIDATION_TARGET: ${{ needs.smoke-mode-gate.outputs.selected_target }}
      SELFSERVE_VALIDATION_EXPECTED_SHA: ${{ needs.smoke-mode-gate.outputs.selfserve_expected_sha }}
      ACCEPTED_CORE_BASELINE: ${{ needs.smoke-prod.outputs.baseline_enabled }}
      ACCEPTED_CORE_SOURCE_SHA: ${{ needs.smoke-prod.outputs.baseline_source_sha }}
      ACCEPTED_CORE_RECEIPT_SHA256: ${{ needs.smoke-prod.outputs.baseline_receipt_sha256 }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      FLEET_RELEASE_TARGETS_JSON: ${{ vars.FLEET_RELEASE_TARGETS_JSON }}
      FLEET_RELEASE_OPS_TARGET_JSON: ${{ vars.FLEET_RELEASE_OPS_TARGET_JSON }}
      FLEET_RELEASE_BACKUP_APP_TARGET_JSON: ${{ vars.FLEET_RELEASE_BACKUP_APP_TARGET_JSON }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve same immutable Core receipt for observation
        if: env.ACCEPTED_CORE_BASELINE == 'true'
        id: baseline
        run: node scripts/accepted-core-baseline.mjs resolve
      - name: Bind observation to preceding smoke receipt
        if: env.ACCEPTED_CORE_BASELINE == 'true'
        env:
          RESOLVED_RECEIPT_HASH: ${{ steps.baseline.outputs.receipt_sha256 }}
        run: test "$RESOLVED_RECEIPT_HASH" = "$ACCEPTED_CORE_RECEIPT_SHA256"
      - uses: actions/checkout@v5
        if: env.ACCEPTED_CORE_BASELINE == 'true'
        with:
          ref: ${{ steps.baseline.outputs.verifier_sha }}
          path: .baseline/verifier
          persist-credentials: false
      - name: Verify Core provider before observation
        if: env.ACCEPTED_CORE_BASELINE == 'true'
        run: node .baseline/verifier/scripts/accepted-core-baseline.mjs provider

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Log in to Azure for observation queries
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run post-deploy observation gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/post-deploy-observation-gate

          if [[ -z "${AZURE_CLIENT_ID:-}" || -z "${AZURE_TENANT_ID:-}" || -z "${AZURE_SUBSCRIPTION_ID:-}" ]]; then
            unset AZURE_APPLICATIONINSIGHTS_APP_NAME
            unset AZURE_APPLICATIONINSIGHTS_RESOURCE_GROUP
          fi

          read_health_release() {
            local health_url="$1"
            local health_json
            local curl_args=(--connect-timeout 10 --max-time 30 -fsS)
            if [[ -n "${2:-}" ]]; then curl_args+=(-H "Cache-Control: no-cache"); fi
            health_json="$(curl "${curl_args[@]}" "$health_url")" || return 1
            EXPECTED_BAKED_SHA="${2:-}" node --input-type=module -e '
              import fs from "node:fs";
              import { healthPayloadMismatch, healthReleaseValidationMismatch } from "./scripts/railway-smoke.mjs";
              const health = JSON.parse(fs.readFileSync(0, "utf8"));
              const expected = process.env.EXPECTED_BAKED_SHA;
              if (expected && (!/^[a-f0-9]{40}$/.test(expected)
                || healthPayloadMismatch({ ok: true }, health)
                || healthReleaseValidationMismatch(health, expected, { requireConfiguredMatch: true })
                || health?.release?.runtime?.gitSha !== expected || health.release.runtime.evidence !== "baked")) {
                throw new Error("OBSERVATION_BAKED_RUNTIME_UNPROVEN");
              }
              const gitSha = health?.release?.gitSha || process.env.GITHUB_SHA;
              const imageTag = health?.release?.imageTag || `sha-${gitSha}`;
              const version = health?.release?.version || `main-${gitSha.slice(0, 12)}`;
              console.log(gitSha);
              console.log(imageTag);
              console.log(version);
            ' <<< "$health_json"
          }

          app_git_sha=""; app_image_tag=""; app_version=""
          if [[ "$PRODUCTION_VALIDATION_TARGET" != "selfserve-validation" ]]; then
          {
            read -r app_git_sha
            read -r app_image_tag
            read -r app_version
          } < <(read_health_release "https://app.corgtex.com/api/health")
          fi

          if [[ "$ACCEPTED_CORE_BASELINE" == "true" ]]; then
            test "$app_git_sha" = "$ACCEPTED_CORE_SOURCE_SHA"
            app_git_sha="$ACCEPTED_CORE_SOURCE_SHA"
            app_image_tag="sha-$ACCEPTED_CORE_SOURCE_SHA"
          fi

          if [[ "$PRODUCTION_VALIDATION_TARGET" == "selfserve-validation" ]]; then
            test -n "$SELFSERVE_VALIDATION_EXPECTED_SHA"
            selfserve_release="$(read_health_release "https://selfserve.corgtex.com/api/health" "$SELFSERVE_VALIDATION_EXPECTED_SHA")"
            {
              read -r selfserve_git_sha
              read -r selfserve_image_tag
              read -r selfserve_version
            } <<< "$selfserve_release"
            test "$selfserve_git_sha" = "$SELFSERVE_VALIDATION_EXPECTED_SHA"
          else
            {
              read -r selfserve_git_sha
              read -r selfserve_image_tag
              read -r selfserve_version
            } < <(read_health_release "https://selfserve.corgtex.com/api/health")
          fi

          {
            read -r ops_git_sha
            read -r ops_image_tag
            read -r ops_version
          } < <(read_health_release "https://ops.corgtex.com/api/health")

          manifest_json="$(
            APP_GIT_SHA="$app_git_sha" \
            APP_IMAGE_TAG="$app_image_tag" \
            APP_VERSION="$app_version" \
            SELFSERVE_GIT_SHA="$selfserve_git_sha" \
            SELFSERVE_IMAGE_TAG="$selfserve_image_tag" \
            SELFSERVE_VERSION="$selfserve_version" \
            OPS_GIT_SHA="$ops_git_sha" \
            OPS_IMAGE_TAG="$ops_image_tag" \
            OPS_VERSION="$ops_version" \
            node -e '
              const targetManifests = [
                { target: "backup-app", gitSha: process.env.APP_GIT_SHA, imageTag: process.env.APP_IMAGE_TAG, releaseVersion: process.env.APP_VERSION },
                { target: "azure-selfserve", gitSha: process.env.SELFSERVE_GIT_SHA, imageTag: process.env.SELFSERVE_IMAGE_TAG, releaseVersion: process.env.SELFSERVE_VERSION },
                { target: "ops", gitSha: process.env.OPS_GIT_SHA, imageTag: process.env.OPS_IMAGE_TAG, releaseVersion: process.env.OPS_VERSION },
              ].filter((entry) => process.env.PRODUCTION_VALIDATION_TARGET !== "selfserve-validation" || entry.target !== "backup-app");
              const gitSha = process.env.PRODUCTION_VALIDATION_TARGET === "selfserve-validation"
                ? process.env.SELFSERVE_GIT_SHA : process.env.GITHUB_SHA;
              console.log(JSON.stringify({ gitSha, targetManifests }));
            '
          )"
          echo "Observation uses live target releases from app, selfserve, and ops health"
          observation_script="scripts/post-deploy-observation-gate.mjs"
          if [[ "$ACCEPTED_CORE_BASELINE" == "true" ]]; then
            observation_script=".baseline/verifier/scripts/post-deploy-observation-gate.mjs"
          fi
          observation_targets=backup-app,azure-selfserve,ops
          if [[ "$PRODUCTION_VALIDATION_TARGET" == "selfserve-validation" ]]; then
            observation_targets=azure-selfserve,ops
          fi
          node "$observation_script" \
            --manifest-json "$manifest_json" \
            --targets "$observation_targets" \
            --since "$OBSERVATION_SINCE" \
            --summary-file .artifacts/post-deploy-observation-gate/main-production-smoke.json

      - name: Verify Core provider after observation
        if: env.ACCEPTED_CORE_BASELINE == 'true'
        run: node .baseline/verifier/scripts/accepted-core-baseline.mjs provider

      - name: Upload observation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-observation-main
          path: .artifacts/post-deploy-observation-gate/main-production-smoke.json
          if-no-files-found: ignore
