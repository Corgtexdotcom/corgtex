name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-scope:
    name: Synthetic Preparation Scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect synthetic harness and strict dependencies
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          # Compare the tested merge tree with its base, including deletions.
          status=0
          git diff --quiet "$BASE_SHA" HEAD -- \
            .github/workflows/ci.yml \
            .github/workflows/azure-migration-postgres-rehearsal.yml \
            'scripts/migration/*synthetic*' \
            'scripts/migration/*ops-azure-target*' \
            'scripts/migration/*postgres*' \
            'scripts/migration/validate-azure-what-if*' \
            infra/azure/migration-foundation \
            package.json package-lock.json .npmrc 'vitest*' || status=$?
          case "$status" in
            0) echo 'changed=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'changed=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  synthetic-preparation:
    name: Synthetic Native ARM64 Preparation
    needs: synthetic-scope
    if: github.event_name == 'pull_request' && needs.synthetic-scope.outputs.changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Set isolated runner-local paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'LOCAL_BUNDLE=%s/synthetic-public-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'LOCAL_EVIDENCE=%s/synthetic-proof-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install locked dependencies without lifecycle scripts
        timeout-minutes: 5
        run: npm ci --ignore-scripts
      - name: Download PUBLIC audited fixed-hash synthetic inputs
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$LOCAL_BUNDLE"
          for asset in source-image.tar synthetic.dump corpus.sql source-baseline.json; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 60 --max-filesize 268435456 \
              "https://github.com/Corgtexdotcom/corgtex/releases/download/ops-synthetic-source-v1/$asset" \
              --output "$LOCAL_BUNDLE/$asset"
          done
          node --input-type=module -e 'import { verifyBundle } from "./scripts/migration/synthetic-ops-source.mjs"; verifyBundle(process.env.LOCAL_BUNDLE);'
      - name: Cache pinned official PostgreSQL client
        timeout-minutes: 3
        run: docker pull docker.io/library/postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
      - name: Exercise native local source and actual client transport
        timeout-minutes: 13
        run: node scripts/migration/prepare-synthetic-ops-local.mjs prepare "$LOCAL_BUNDLE" "$LOCAL_EVIDENCE"
      - name: Retry owned local cleanup
        if: always() && env.LOCAL_EVIDENCE != ''
        timeout-minutes: 2
        run: node scripts/migration/prepare-synthetic-ops-local.mjs cleanup "$LOCAL_EVIDENCE"
      # Missing summary after cancellation is UNPROVEN, never cleanup success.
      # Full local ownership/TLS/source receipts and payloads are not uploaded.
      - name: Retain sanitized local preparation summary
        if: always() && env.LOCAL_EVIDENCE != ''
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-native-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LOCAL_EVIDENCE }}/public-summary.json
          if-no-files-found: error
          retention-days: 7

  # Keep the PR and merge-queue gate comprehensive, but do not serialize
  # independent checks. This preserves the existing required check names while
  # letting test, migration, and build failures surface in parallel.
  hotfix-candidate:
    uses: ./.github/workflows/selfserve-hotfix-check.yml
    permissions:
      contents: read

  check:
    name: Lint, Typecheck & Test
    needs: [check-native, test, hotfix-candidate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require native checks and every test shard
        env:
          NATIVE_RESULT: ${{ needs.check-native.result }}
          TEST_RESULT: ${{ needs.test.result }}
          HOTFIX_RESULT: ${{ needs.hotfix-candidate.result }}
        run: |
          set -euo pipefail
          test "$NATIVE_RESULT" = success
          test "$TEST_RESULT" = success
          test "$HOTFIX_RESULT" = success

  test:
    name: Unit & Integration Tests (${{ matrix.shard }}/3)
    # Keep verified image imports on the supported runner; ubuntu-latest rolls forward.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corgtex_test?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Prepare verified upstream PostgreSQL fixture
        uses: ./.github/actions/ci-pgvector
        timeout-minutes: 15
        with:
          database: corgtex_test
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx vitest run --project unit --project integration --shard ${{ matrix.shard }}/3
      - name: Remove isolated PostgreSQL fixture
        if: always()
        run: docker rm --force --volumes corgtex-ci-postgres || true

  check-native:
    name: Lint, Typecheck & Native Checks
    # Keep verified image imports on the supported runner; ubuntu-latest rolls forward.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corgtex_test?schema=public

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Prepare verified upstream PostgreSQL fixture
        id: pgvector
        uses: ./.github/actions/ci-pgvector
        timeout-minutes: 15
        with:
          database: corgtex_test
          tenant-transfer: "true"

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run check:unused:locals

      - run: npm run prisma:validate

      - run: npm run check:private-boundary

      - run: npx prisma migrate deploy

      - name: Prepare custody fixture images on this runner
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker pull docker.io/library/postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
          docker pull mcr.microsoft.com/azure-storage/azurite:3.35.0

      - name: Test guarded validation owner adoption
        run: node --test scripts/adopt-validation-support-owner.integration.test.mjs
        env:
          QA_OWNER_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Test read-only schema auditor relation privileges
        run: node --test scripts/selfserve-validation-schema.integration.test.mjs scripts/selfserve-schema-catalog.integration.test.mjs
        env:
          QA_SCHEMA_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Test exact hotfix admission and provenance
        run: node --test scripts/release/*hotfix*.node-test.mjs

      - name: Test bounded Ops GitHub synchronization
        timeout-minutes: 5
        run: npx vitest run --project unit scripts/ops/github-api.test.mjs scripts/ops/github-incident.test.mjs scripts/ci-production-boundary.test.mjs

      - name: Test Azure site image release and read-only Ops receipt
        run: node --test scripts/azure-site-image-release.node-test.mjs scripts/release/ops-readiness-receipt.node-test.mjs

      - name: Test Azure monitor and Ops provisioning defaults
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          bicep_dir="$RUNNER_TEMP/bicep-v0.38.5"
          mkdir -p "$bicep_dir"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 --max-filesize 104857600 \
            https://github.com/Azure/bicep/releases/download/v0.38.5/bicep-linux-x64 \
            --output "$bicep_dir/bicep"
          # SHA-256 published for bicep-linux-x64 in the official v0.38.5 release.
          printf '%s  %s\n' 7853e83d533d93afc67d8ccec87b982edbd334137616ade14b994c6b774bde24 "$bicep_dir/bicep" \
            | sha256sum --check --strict
          chmod +x "$bicep_dir/bicep"
          BICEP_CLI_PATH="$bicep_dir/bicep" DOTNET_BUNDLE_EXTRACT_BASE_DIR="$bicep_dir/.net" \
            node --test infra/azure/hosting/monitor.node-test.mjs infra/azure/ops-core/infra.node-test.mjs

      # Unconditional on PRs and merge groups: billing sources, fixtures,
      # templates, and this workflow cannot be excluded by a path filter.
      - name: Test offline Azure billing ledger and runtime
        timeout-minutes: 3
        run: python3 -B -m unittest discover -s scripts/ops -p 'test_azure_billing_*.py' -v

      - name: Exercise synthetic Azure billing runtime
        timeout-minutes: 1
        run: python3 -B scripts/ops/azure_billing_mock.py

      - name: Compile inactive Azure billing templates with pinned Bicep
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          bicep_dir="$RUNNER_TEMP/bicep-v0.38.5"
          DOTNET_BUNDLE_EXTRACT_BASE_DIR="$bicep_dir/.net" "$bicep_dir/bicep" build \
            infra/azure/billing-monitor/main.bicep \
            --outfile "$RUNNER_TEMP/billing-monitor.json"

      - name: Test Ops and Core migration custody, fences and retained restore
        timeout-minutes: 15
        run: npm run test:migration:ops-core
        env:
          CI_PGVECTOR_PG18_CONFIG_ID: ${{ steps.pgvector.outputs.pg18-config-id }}

      - name: Install PostgreSQL capture client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16

      - name: Test isolated tenant transfer
        run: npm run test:tenant-transfer

      - name: Test PostgreSQL 18 to 16 NOT NULL compatibility
        timeout-minutes: 10
        run: npm run test:migration:pg18-pg16-notnull
        env:
          CI_PGVECTOR_PG18_CONFIG_ID: ${{ steps.pgvector.outputs.pg18-config-id }}

      - name: Remove isolated PostgreSQL fixture
        if: always()
        run: docker rm --force --volumes corgtex-ci-postgres || true

  db-sync:
    name: Database Sync
    # Keep verified image imports on the supported runner; ubuntu-latest rolls forward.
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corgtex_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      ADMIN_EMAIL: system+corgtex@corgtex.local
      ADMIN_PASSWORD: corgtex-test-agent-pw

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Prepare verified upstream PostgreSQL fixture
        uses: ./.github/actions/ci-pgvector
        timeout-minutes: 15
        with:
          database: corgtex_ci

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - run: npx prisma migrate deploy

      - run: npm run check:migration-fixtures

      - run: npm run check:seed-fixtures

      - name: Remove isolated PostgreSQL fixture
        if: always()
        run: docker rm --force --volumes corgtex-ci-postgres || true

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: env -u DATABASE_URL -u SHADOW_DATABASE_URL npm run build

      - run: npm run build:site

  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/check-public-docs.mjs
      - run: node scripts/check-private-boundary.mjs
      - run: npm i -g mint@4.2.717
      - run: mint validate
        working-directory: docs
      - run: mint broken-links
        working-directory: docs

  pr-policy:
    name: PR Policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Verify PR contract
        if: github.event_name == 'pull_request'
        run: node scripts/check-plan.mjs --mode=present
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Verify declared scope
        if: github.event_name == 'pull_request'
        run: node scripts/check-plan.mjs --mode=scope
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Verify agent policy checks
        if: github.event_name == 'pull_request'
        run: node scripts/check-plan.mjs --mode=policy
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Merge queue policy gate
        if: github.event_name == 'merge_group'
        run: echo "PR Policy passed on pull_request before merge queue entry."

  # Temporary required-check aliases. Remove after branch protection requires
  # `PR Policy` instead of these three legacy context names.
  plan-present-compat:
    name: Plan Present
    needs: pr-policy
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.pr-policy.result }}" = "success"

  scope-check-compat:
    name: Scope Check
    needs: pr-policy
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.pr-policy.result }}" = "success"

  diff-size-compat:
    name: Diff Size
    needs: pr-policy
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.pr-policy.result }}" = "success"

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Install gitleaks
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --redact --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Merge queue secret-scan gate
        if: github.event_name == 'merge_group'
        run: echo "Secret Scan passed on pull_request before merge queue entry."

  client-data-scan:
    name: Client Data Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Scan for client data leaks
        if: github.event_name == 'pull_request'
        run: node scripts/check-client-data-leak.mjs
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
      - name: Merge queue client-data gate
        if: github.event_name == 'merge_group'
        run: echo "Client Data Scan passed on pull_request before merge queue entry."

  required:
    name: CI Required
    needs: [check, db-sync, build, docs, gitleaks, client-data-scan]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all six CI results
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'length == 6 and all(.[]; .result == "success")' <<< "$CHECK_RESULTS"
