name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the PR and merge-queue gate comprehensive, but do not serialize
  # independent checks. This preserves the existing required check names while
  # letting test, migration, and build failures surface in parallel.
  check:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corgtex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corgtex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corgtex_test?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run prisma:validate

      - run: npm run check:private-boundary

      - run: npx prisma migrate deploy

      - run: npx vitest run --project unit --project integration

  db-sync:
    name: Database Sync
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corgtex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corgtex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corgtex_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - run: npx prisma migrate deploy

      - run: npm run check:migration-fixtures

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: env -u DATABASE_URL -u SHADOW_DATABASE_URL npm run build

      - run: npm run build:site

  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/check-public-docs.mjs
      - run: node scripts/check-private-boundary.mjs
      - run: npm i -g mint
      - run: mint validate
        working-directory: docs
      - run: mint broken-links
        working-directory: docs

  plan-present:
    name: Plan Present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check PR body plan exists
        if: github.event_name == 'pull_request'
        run: node scripts/check-plan.mjs --mode=present
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Merge queue plan gate
        if: github.event_name == 'merge_group'
        run: echo "Plan Present passed on pull_request before merge queue entry."

  scope-check:
    name: Scope Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    needs: plan-present
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Verify changed files are within plan scope
        if: github.event_name == 'pull_request'
        run: node scripts/check-plan.mjs --mode=scope
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Verify agent policy checks
        if: github.event_name == 'pull_request'
        run: node scripts/check-plan.mjs --mode=policy
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Merge queue scope gate
        if: github.event_name == 'merge_group'
        run: echo "Scope Check passed on pull_request before merge queue entry."

  diff-size:
    name: Diff Size
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Verify diff size within caps
        if: github.event_name == 'pull_request'
        run: node scripts/check-plan.mjs --mode=size
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Merge queue diff-size gate
        if: github.event_name == 'merge_group'
        run: echo "Diff Size passed on pull_request before merge queue entry."

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Install gitleaks
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --redact --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Merge queue secret-scan gate
        if: github.event_name == 'merge_group'
        run: echo "Secret Scan passed on pull_request before merge queue entry."

  client-data-scan:
    name: Client Data Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Scan for client data leaks
        if: github.event_name == 'pull_request'
        run: node scripts/check-client-data-leak.mjs
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
      - name: Merge queue client-data gate
        if: github.event_name == 'merge_group'
        run: echo "Client Data Scan passed on pull_request before merge queue entry."

  smoke-prod:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs:
      - check
      - db-sync
      - build
    steps:
      - name: Non-production smoke gate
        if: github.ref != 'refs/heads/main'
        run: echo "Production smoke runs after main deployment; required check is satisfied for PR and merge queue."

      - name: Skip if secrets not configured
        if: github.ref == 'refs/heads/main'
        id: check-secrets
        run: |
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ] || [ -z "${{ secrets.ADMIN_EMAIL }}" ] || [ -z "${{ secrets.ADMIN_PASSWORD }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Smoke test skipped — secrets not configured"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for healthy self-serve deployment
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -sf https://selfserve.corgtex.com/api/health > /dev/null 2>&1; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "Deployment health check timed out after 5 minutes"
          exit 1
      - name: Confirm backup app health
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        run: curl -sf https://app.corgtex.com/api/health > /dev/null
      
      - uses: actions/checkout@v5
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        with:
          fetch-depth: 0
      - name: Detect production app release requirement
        id: app-release
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "skip_release_match=false" >> "$GITHUB_OUTPUT"
            echo "Previous main commit is unknown; release match remains required."
            exit 0
          fi

          changed_files="$(git diff --name-only "$before" "$after")"
          echo "Changed files:"
          printf '%s\n' "$changed_files"

          requires_app_release=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              AGENTS.md|README.md|docs/*|.github/*|.agents/*|.codex/*)
                ;;
              *)
                requires_app_release=true
                ;;
            esac
          done <<< "$changed_files"

          if [ "$requires_app_release" = "true" ]; then
            echo "skip_release_match=false" >> "$GITHUB_OUTPUT"
            echo "Production app-affecting changes detected; release match required."
          else
            echo "skip_release_match=true" >> "$GITHUB_OUTPUT"
            echo "Only docs, workflow, or agent-guidance files changed; release match skipped while live smoke still runs."
          fi
      - uses: actions/setup-node@v5
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
      - run: npx prisma generate
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
      - run: node scripts/check-migration-health.mjs
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - run: node scripts/self-serve-production-readiness.mjs --base-url=https://selfserve.corgtex.com
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
      - run: node scripts/railway-smoke.mjs https://app.corgtex.com ${{ secrets.ADMIN_EMAIL }} ${{ secrets.ADMIN_PASSWORD }}
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        env:
          CORGTEX_SKIP_RELEASE_MATCH: ${{ steps.app-release.outputs.skip_release_match }}
          CORGTEX_RELEASE_MATCH_TIMEOUT_MS: 1200000
      - run: node scripts/ingestion-guidance-smoke.mjs https://app.corgtex.com ${{ secrets.ADMIN_EMAIL }} ${{ secrets.ADMIN_PASSWORD }}
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
