name: Azure Self-Serve Staging

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Preview, deploy, probe staged secrets, or execute a verified migration image."
        required: true
        type: choice
        default: what-if
        options:
          - what-if
          - deploy
          - probe-migration-secrets
          - run-migration
      resource_group:
        description: "Azure resource group for staging."
        required: true
        type: string
        default: rg-corgtex-selfserve-staging-wus3
      location:
        description: "Azure region for app/data resources."
        required: true
        type: string
        default: westus3
      name_prefix:
        description: "Short lowercase Azure resource prefix."
        required: true
        type: string
        default: corgtex-ss-stg
      deploy_container_apps:
        description: "Create/update web, worker, and migration job after Key Vault secrets exist."
        required: true
        type: boolean
        default: false
      prepare_migration_job:
        description: "Update only the migration job image, leaving web and worker untouched; preview with what-if first."
        required: true
        type: boolean
        default: false
      shared_state_backend:
        description: "Explicitly enter redis or postgres for this run; never infer the currently accepted backend."
        required: true
        type: string
      run_migration_job:
        description: "Run the prepared migrate/seed job in a separate protected run."
        required: true
        type: boolean
        default: false
      expected_migration_image:
        description: "Exact prepared ACR image digest; required for secret probe and run-migration."
        required: false
        type: string
        default: ""
      run_health_smoke:
        description: "Probe the Azure web app /api/health endpoint."
        required: true
        type: boolean
        default: false
      run_browser_smoke:
        description: "Run the self-serve browser signup smoke against app_url."
        required: true
        type: boolean
        default: false
      smoke_email_capture_allowed_domains:
        description: "Comma-separated domains allowed for smoke-only setup email capture."
        required: true
        type: string
        default: selfserve-staging.corgtex.com
      app_url:
        description: "Configured Azure self-serve app origin."
        required: true
        type: string
        default: https://selfserve-staging.corgtex.com
      site_url:
        description: "Marketing site origin used by signup smoke."
        required: true
        type: string
        default: https://www.corgtex.com
      control_plane_url:
        description: "Control-plane origin for app runtime configuration."
        required: true
        type: string
        default: https://ops.corgtex.com
      azure_openai_auth_mode:
        description: "Azure OpenAI auth mode for the runtime."
        required: true
        type: choice
        default: managed_identity
        options:
          - managed_identity
          - api_key
      model_provider:
        description: "Model routing provider for staging. Use azure-foundry only with a Direct Azure Foundry base URL."
        required: true
        type: choice
        default: azure-openai
        options:
          - azure-openai
          - azure-foundry
      azure_foundry_base_url:
        description: "Azure Direct Foundry OpenAI-compatible v1 base URL; required when model_provider=azure-foundry."
        required: false
        type: string
        default: ""
      allow_azure_service_postgres_firewall:
        description: "Allow Azure services through the Postgres firewall."
        required: true
        type: boolean
        default: false
      enable_stripe_secrets:
        description: "Reference Stripe Key Vault secrets in the Container Apps runtime."
        required: true
        type: boolean
        default: false
      enable_resend_secrets:
        description: "Reference Resend Key Vault secrets in the Container Apps runtime."
        required: true
        type: boolean
        default: false
      enable_google_oauth_secrets:
        description: "Reference Google OAuth Key Vault secrets in the Container Apps runtime."
        required: true
        type: boolean
        default: false
      enable_microsoft_oauth_secrets:
        description: "Reference Microsoft OAuth Key Vault secrets in the Container Apps runtime."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-selfserve-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and smoke Azure staging
    runs-on: ubuntu-latest
    environment: azure-selfserve-staging
    env:
      OPERATION: ${{ inputs.operation }}
      RESOURCE_GROUP: ${{ inputs.resource_group }}
      LOCATION: ${{ inputs.location }}
      NAME_PREFIX: ${{ inputs.name_prefix }}
      DEPLOY_CONTAINER_APPS: ${{ inputs.deploy_container_apps }}
      PREPARE_MIGRATION_JOB: ${{ inputs.prepare_migration_job }}
      SHARED_STATE_BACKEND: ${{ inputs.shared_state_backend }}
      RUN_MIGRATION_JOB: ${{ inputs.run_migration_job }}
      EXPECTED_MIGRATION_IMAGE: ${{ inputs.expected_migration_image }}
      RUN_HEALTH_SMOKE: ${{ inputs.run_health_smoke }}
      RUN_BROWSER_SMOKE: ${{ inputs.run_browser_smoke }}
      SMOKE_EMAIL_CAPTURE_ALLOWED_DOMAINS: ${{ inputs.smoke_email_capture_allowed_domains }}
      APP_URL: ${{ inputs.app_url }}
      SITE_URL: ${{ inputs.site_url }}
      CONTROL_PLANE_URL: ${{ inputs.control_plane_url }}
      AZURE_OPENAI_AUTH_MODE: ${{ inputs.azure_openai_auth_mode }}
      MODEL_PROVIDER: ${{ inputs.model_provider }}
      AZURE_FOUNDRY_BASE_URL: ${{ inputs.azure_foundry_base_url || vars.AZURE_SELFSERVE_STAGING_FOUNDRY_BASE_URL }}
      ALLOW_AZURE_SERVICE_POSTGRES_FIREWALL: ${{ inputs.allow_azure_service_postgres_firewall }}
      ENABLE_STRIPE_SECRETS: ${{ inputs.enable_stripe_secrets }}
      ENABLE_RESEND_SECRETS: ${{ inputs.enable_resend_secrets }}
      ENABLE_GOOGLE_OAUTH_SECRETS: ${{ inputs.enable_google_oauth_secrets }}
      ENABLE_MICROSOFT_OAUTH_SECRETS: ${{ inputs.enable_microsoft_oauth_secrets }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_SELFSERVE_STAGING_POSTGRES_ADMIN_PASSWORD }}
      AZURE_OPENAI_BASE_URL: ${{ vars.AZURE_SELFSERVE_STAGING_OPENAI_BASE_URL }}
      SMOKE_EMAIL_CAPTURE_SECRET: ${{ secrets.AZURE_SELFSERVE_STAGING_SMOKE_EMAIL_CAPTURE_SECRET }}
      SELF_SERVE_SMOKE_EMAIL_DOMAIN: ${{ vars.AZURE_SELFSERVE_STAGING_SMOKE_EMAIL_DOMAIN }}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
      CRM_INQUIRY_WORKSPACE_SLUG: ${{ vars.CRM_INQUIRY_WORKSPACE_SLUG || '' }}
      CRM_INQUIRY_ACKNOWLEDGEMENT_CC_EMAIL: ${{ vars.CRM_INQUIRY_ACKNOWLEDGEMENT_CC_EMAIL || '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate workflow configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          require() {
            local name="$1"
            local value="${!name:-}"
            if [[ -z "$value" ]]; then
              missing+=("$name")
            fi
          }

          require AZURE_CLIENT_ID
          require AZURE_TENANT_ID
          require AZURE_SUBSCRIPTION_ID
          require POSTGRES_ADMIN_PASSWORD
          require AZURE_OPENAI_BASE_URL
          validate_azure_base_url() {
            local name="$1"
            local provider="$2"
            local value="$3"
            node - "$name" "$provider" "$value" <<'NODE'
          const [name, provider, value] = process.argv.slice(2);

          let url;
          try {
            url = new URL(value);
          } catch {
            console.error(`::error::${name} must be a valid HTTPS Azure OpenAI-compatible /openai/v1 endpoint.`);
            process.exit(1);
          }

          const host = url.hostname.toLowerCase();
          const path = url.pathname.replace(/\/+$/, "");
          const expectedHostSuffix = provider === "azure-foundry"
            ? ".services.ai.azure.com"
            : ".openai.azure.com";
          const valid = url.protocol === "https:"
            && !url.username
            && !url.password
            && !url.port
            && !url.search
            && !url.hash
            && path === "/openai/v1"
            && host.endsWith(expectedHostSuffix);

          if (!valid) {
            console.error(`::error::${name} must be an HTTPS Azure OpenAI-compatible endpoint under ${expectedHostSuffix}/openai/v1 without credentials, custom ports, query, or fragment.`);
            process.exit(1);
          }
          NODE
          }

          validate_azure_base_url AZURE_OPENAI_BASE_URL azure-openai "$AZURE_OPENAI_BASE_URL"
          if [[ "$MODEL_PROVIDER" == "azure-foundry" ]]; then
            require AZURE_FOUNDRY_BASE_URL
            if [[ -n "$AZURE_FOUNDRY_BASE_URL" ]]; then
              validate_azure_base_url AZURE_FOUNDRY_BASE_URL azure-foundry "$AZURE_FOUNDRY_BASE_URL"
            fi
          fi

          if [[ "$OPERATION" == "deploy" && ( "$DEPLOY_CONTAINER_APPS" == "true" || "$PREPARE_MIGRATION_JOB" == "true" ) ]]; then
            require NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
          fi

          if [[ -n "$CRM_INQUIRY_WORKSPACE_SLUG" || -n "$CRM_INQUIRY_ACKNOWLEDGEMENT_CC_EMAIL" ]]; then
            require CRM_INQUIRY_WORKSPACE_SLUG
            require CRM_INQUIRY_ACKNOWLEDGEMENT_CC_EMAIL
            if [[ "$ENABLE_RESEND_SECRETS" != "true" ]]; then
              echo "::error::CRM inquiry acknowledgement requires enable_resend_secrets=true."
              exit 1
            fi
            node - "$CRM_INQUIRY_ACKNOWLEDGEMENT_CC_EMAIL" <<'NODE'
          const [value] = process.argv.slice(2);
          const addresses = value.split(",").map((address) => address.trim()).filter(Boolean);
          if (addresses.length === 0 || !addresses.every((address) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(address))) {
            console.error("::error::CRM_INQUIRY_ACKNOWLEDGEMENT_CC_EMAIL must be a comma-separated list of valid email addresses.");
            process.exit(1);
          }
          NODE
          fi

          if [[ "$RUN_BROWSER_SMOKE" == "true" ]]; then
            require SMOKE_EMAIL_CAPTURE_SECRET
            require SELF_SERVE_SMOKE_EMAIL_DOMAIN
            allowed=",${SMOKE_EMAIL_CAPTURE_ALLOWED_DOMAINS//[[:space:]]/},"
            if [[ -n "$SELF_SERVE_SMOKE_EMAIL_DOMAIN" && "$allowed" != *",$SELF_SERVE_SMOKE_EMAIL_DOMAIN,"* ]]; then
              echo "::error::SELF_SERVE_SMOKE_EMAIL_DOMAIN must be included in smoke_email_capture_allowed_domains."
              exit 1
            fi
          fi

          if [[ "$RUN_MIGRATION_JOB" == "true" && "$OPERATION" != "run-migration" ]]; then
            echo "::error::run_migration_job requires operation=run-migration."
            exit 1
          fi
          if [[ "$SHARED_STATE_BACKEND" != "redis" && "$SHARED_STATE_BACKEND" != "postgres" ]]; then
            echo "::error::shared_state_backend must be explicitly set to redis or postgres."
            exit 1
          fi
          if [[ "$PREPARE_MIGRATION_JOB" == "true" && "$DEPLOY_CONTAINER_APPS" == "true" ]]; then
            echo "::error::Prepare the migration job before updating web and worker, in a separate run."
            exit 1
          fi
          if [[ "$PREPARE_MIGRATION_JOB" == "true" && "$SHARED_STATE_BACKEND" != "redis" ]]; then
            echo "::error::Prepare the migration job with shared_state_backend=redis while existing web and worker still use Redis."
            exit 1
          fi
          if [[ "$OPERATION" == "run-migration" && ( "$RUN_MIGRATION_JOB" != "true" || "$PREPARE_MIGRATION_JOB" == "true" || "$DEPLOY_CONTAINER_APPS" == "true" ) ]]; then
            echo "::error::run-migration requires only run_migration_job=true; prepare and app deployment must be separate."
            exit 1
          fi
          if [[ "$OPERATION" == "probe-migration-secrets" && ( "$RUN_MIGRATION_JOB" == "true" || "$PREPARE_MIGRATION_JOB" == "true" || "$DEPLOY_CONTAINER_APPS" == "true" || "$RUN_HEALTH_SMOKE" == "true" || "$RUN_BROWSER_SMOKE" == "true" || "$SHARED_STATE_BACKEND" != "redis" ) ]]; then
            echo "::error::The migration secret probe requires redis and all deploy, migration, and smoke flags false."
            exit 1
          fi
          if [[ "$OPERATION" == "probe-migration-secrets" && ( "$RESOURCE_GROUP" != "rg-corgtex-selfserve-staging-wus3" || "$LOCATION" != "westus3" || "$NAME_PREFIX" != "corgtex-ss-stg" ) ]]; then
            echo "::error::The migration secret probe is limited to the pinned staging resource group and job."
            exit 1
          fi
          if [[ "$RUN_MIGRATION_JOB" == "true" && "$SHARED_STATE_BACKEND" != "redis" ]]; then
            echo "::error::Run the migration with shared_state_backend=redis, then deploy postgres in a separate run after verifying the migration."
            exit 1
          fi
          if [[ ( "$OPERATION" == "probe-migration-secrets" || "$RUN_MIGRATION_JOB" == "true" ) && ! "$EXPECTED_MIGRATION_IMAGE" =~ ^[^[:space:]]+/corgtex/web@sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::The migration secret probe and run-migration require the exact prepared ACR image digest reference."
            exit 1
          fi

          if (( ${#missing[@]} > 0 )); then
            printf "::error::Missing GitHub environment settings: %s\\n" "${missing[*]}"
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm Azure context
        shell: bash
        run: |
          set -euo pipefail
          az account show --query "{tenantId: tenantId, subscriptionId: id, name: name}" --output table

      - name: Resolve staging registry
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t registries < <(az acr list --resource-group "$RESOURCE_GROUP" --query '[].name' --output tsv)
          if [[ ${#registries[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one staging registry in $RESOURCE_GROUP."
            exit 1
          fi
          acr_name="${registries[0]}"
          acr_server="$(az acr show --resource-group "$RESOURCE_GROUP" --name "$acr_name" --query loginServer --output tsv)"
          admin_enabled="$(az acr show --resource-group "$RESOURCE_GROUP" --name "$acr_name" --query adminUserEnabled --output tsv)"
          if [[ "$acr_server" != "${acr_name}.azurecr.io" || "$admin_enabled" != "true" ]]; then
            echo "::error::Staging registry binding or credential mode changed."
            exit 1
          fi
          echo "registry_name=$acr_name" >> "$GITHUB_ENV"
          echo "registry_server=$acr_server" >> "$GITHUB_ENV"
          echo "registry_username=$acr_name" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        if: ${{ inputs.operation == 'deploy' && (inputs.deploy_container_apps || inputs.prepare_migration_job) }}

      - name: Log in to staging ACR
        if: ${{ inputs.operation == 'deploy' && (inputs.deploy_container_apps || inputs.prepare_migration_job) }}
        shell: bash
        run: |
          set -euo pipefail
          acr_password="$(az acr credential show --resource-group "$RESOURCE_GROUP" --name "$registry_name" --query 'passwords[0].value' --output tsv)"
          if [[ -z "$acr_password" ]]; then
            echo "::error::Staging registry credential unavailable."
            exit 1
          fi
          printf '%s' "$acr_password" | docker login "$registry_server" --username "$registry_username" --password-stdin
          unset acr_password

      - name: Compute immutable image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repo="${registry_server}/corgtex"
          sha_tag="sha-${GITHUB_SHA}"
          echo "web=${repo}/web:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "worker=${repo}/worker:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "web_image=${repo}/web:${sha_tag}" >> "$GITHUB_ENV"
          echo "worker_image=${repo}/worker:${sha_tag}" >> "$GITHUB_ENV"
          echo "release_image_tag=${sha_tag}" >> "$GITHUB_ENV"
          echo "release_git_sha=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "release_version=${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Verify prepared migration image for execution
        if: ${{ inputs.operation == 'run-migration' || inputs.operation == 'probe-migration-secrets' }}
        shell: bash
        run: |
          set -euo pipefail
          job_name="caj-${NAME_PREFIX}-migrate"
          container_count="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" --query 'length(properties.template.containers)' --output tsv)"
          current_name="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" --query 'properties.template.containers[0].name' --output tsv)"
          current_image="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" --query 'properties.template.containers[0].image' --output tsv)"
          current_registry="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" --query 'properties.configuration.registries[0].server' --output tsv)"
          registry_secret="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" --query 'properties.configuration.registries[0].passwordSecretRef' --output tsv)"
          if [[ "$container_count" != "1" || "$current_name" != "migrate" || "$current_registry" != "$registry_server" || "$registry_secret" != "ghcr-pat" || "$EXPECTED_MIGRATION_IMAGE" != "${registry_server}/corgtex/web@sha256:"* || "$current_image" != "$EXPECTED_MIGRATION_IMAGE" ]]; then
            echo "::error::Prepared migration job image differs from the approved ACR digest."
            exit 1
          fi
          echo "Verified migration image: ${current_image}"

      - name: Probe staged migration secret references without SQL
        if: ${{ inputs.operation == 'probe-migration-secrets' }}
        shell: bash
        run: |
          set -euo pipefail
          job_name="caj-${NAME_PREFIX}-migrate"
          job_json="$(mktemp)"
          request_json="$(mktemp)"
          execution_json="$(mktemp)"
          execution_name=""
          probe_succeeded=false
          cleanup_probe() {
            if [[ "$probe_succeeded" != "true" && -n "$execution_name" ]]; then
              echo "::warning::Stopping the exact staging secret probe execution after an unverified result."
              az containerapp job stop --resource-group "$RESOURCE_GROUP" --name "$job_name" \
                --job-execution-name "$execution_name" --output none || echo "::error::Exact secret probe stop needs operator reconciliation."
            fi
            rm -f "$job_json" "$request_json" "$execution_json"
          }
          trap cleanup_probe EXIT
          job_id="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" --query id --output tsv)"
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" \
            --query '{template:properties.template,registries:properties.configuration.registries}' --output json > "$job_json"
          python3 scripts/migration/build-staging-secret-probe.py build "$job_json" "$EXPECTED_MIGRATION_IMAGE" "$request_json"
          execution_name="$(python3 scripts/migration/start-staging-secret-probe.py \
            "$job_id" "$job_name" "$request_json")"
          if [[ ! "$execution_name" == "${job_name}-"* ]]; then
            echo "::error::Secret probe start outcome is indeterminate; inspect job executions before any retry."
            exit 1
          fi
          echo "Secret probe execution: ${execution_name}"
          execution_found=false
          for attempt in {1..12}; do
            if az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$job_name" \
              --job-execution-name "$execution_name" --query '{template:properties.template,status:properties.status}' \
              --output json > "$execution_json" 2>/dev/null; then
              execution_found=true
              break
            fi
            sleep 5
          done
          if [[ "$execution_found" != "true" ]] || ! python3 scripts/migration/build-staging-secret-probe.py verify "$execution_json" "$request_json"; then
            echo "::error::Secret probe execution template is unverified."
            exit 1
          fi
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            status="$(az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$job_name" \
              --job-execution-name "$execution_name" --query properties.status --output tsv)"
            case "$status" in
              Succeeded)
                echo "Staging migration secret references resolved with the pinned image; no migration SQL ran."
                probe_succeeded=true
                exit 0
                ;;
              Failed|Canceled)
                echo "::error::Secret probe execution ended with status $status."
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Secret probe did not finish within ten minutes."
          exit 1

      - name: Preview existing migration job image only
        if: ${{ inputs.prepare_migration_job && !inputs.deploy_container_apps }}
        shell: bash
        run: |
          set -euo pipefail
          job_name="caj-${NAME_PREFIX}-migrate"
          current_name="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" --query 'properties.template.containers[0].name' --output tsv)"
          current_image="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" --query 'properties.template.containers[0].image' --output tsv)"
          current_registry="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" --query 'properties.configuration.registries[0].server' --output tsv)"
          registry_secret="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" --query 'properties.configuration.registries[0].passwordSecretRef' --output tsv)"
          if [[ "$current_name" != "migrate" || "$current_registry" != "$registry_server" || "$registry_secret" != "ghcr-pat" || ( "$current_image" != "${registry_server}/corgtex/web:sha-"* && "$current_image" != "${registry_server}/corgtex/web@sha256:"* ) ]]; then
            echo "::error::Existing staging migration job binding changed; refusing image-only update."
            exit 1
          fi
          echo "Migration job only: ${job_name}"
          echo "Current image: ${current_image}"
          echo "Proposed image: ${web_image}"
          echo "Other job settings and backing resources are outside this update."
          echo "migration_job_source_image=${current_image}" >> "$GITHUB_ENV"

      - name: Build and push web image
        id: web_build
        if: ${{ inputs.operation == 'deploy' && (inputs.deploy_container_apps || inputs.prepare_migration_job) }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          build-args: |
            CORGTEX_RELEASE_GIT_SHA=${{ github.sha }}
            GITHUB_SHA=${{ github.sha }}
            REQUIRE_NEXT_SERVER_ACTIONS_KEY=true
          secrets: |
            next_server_actions_encryption_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          push: true
          tags: ${{ steps.image.outputs.web }}

      - name: Pin built migration image by digest
        if: ${{ inputs.operation == 'deploy' && inputs.prepare_migration_job && !inputs.deploy_container_apps }}
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.web_build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Build did not return a valid image digest."
            exit 1
          fi
          echo "migration_job_target_image=${registry_server}/corgtex/web@${BUILT_DIGEST}" >> "$GITHUB_ENV"

      - name: Build and push worker image
        if: ${{ inputs.operation == 'deploy' && inputs.deploy_container_apps }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          build-args: |
            CORGTEX_RELEASE_GIT_SHA=${{ github.sha }}
            GITHUB_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.image.outputs.worker }}

      - name: Ensure resource group for deployment
        if: ${{ inputs.operation == 'deploy' && (!inputs.prepare_migration_job || inputs.deploy_container_apps) }}
        shell: bash
        run: |
          set -euo pipefail
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --tags app=corgtex environment=staging workload=self-serve managed-by=github-actions \
            --output none

      - name: Confirm resource group exists for preview or job update
        if: ${{ inputs.operation == 'what-if' || inputs.operation == 'run-migration' || (inputs.prepare_migration_job && !inputs.deploy_container_apps) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(az group exists --name "$RESOURCE_GROUP")" != "true" ]]; then
            echo "::error::Resource group $RESOURCE_GROUP does not exist. Run operation=deploy with deploy_container_apps=false after approval to create backing resources."
            exit 1
          fi

      - name: Preview Azure deployment
        if: ${{ (inputs.operation == 'what-if' || inputs.operation == 'deploy') && (!inputs.prepare_migration_job || inputs.deploy_container_apps) }}
        shell: bash
        run: |
          set -euo pipefail
          parameters=(
            "location=$LOCATION"
            "namePrefix=$NAME_PREFIX"
            "deployContainerApps=$DEPLOY_CONTAINER_APPS"
            "deployMigrationJob=$PREPARE_MIGRATION_JOB"
            "sharedStateBackend=$SHARED_STATE_BACKEND"
            "appUrl=$APP_URL"
            "siteUrl=$SITE_URL"
            "controlPlaneUrl=$CONTROL_PLANE_URL"
            "webImage=$web_image"
            "workerImage=$worker_image"
            "releaseVersion=$release_version"
            "releaseImageTag=$release_image_tag"
            "releaseGitSha=$release_git_sha"
            "registryServer=$registry_server"
            "registryUsername=$registry_username"
            "azureOpenAiBaseUrl=$AZURE_OPENAI_BASE_URL"
            "azureFoundryBaseUrl=$AZURE_FOUNDRY_BASE_URL"
            "modelProvider=$MODEL_PROVIDER"
            "azureOpenAiAuthMode=$AZURE_OPENAI_AUTH_MODE"
            "allowAzureServicePostgresFirewall=$ALLOW_AZURE_SERVICE_POSTGRES_FIREWALL"
            "smokeEmailCaptureAllowedDomains=$SMOKE_EMAIL_CAPTURE_ALLOWED_DOMAINS"
            "crmInquiryWorkspaceSlug=$CRM_INQUIRY_WORKSPACE_SLUG"
            "crmInquiryAcknowledgementCcEmail=$CRM_INQUIRY_ACKNOWLEDGEMENT_CC_EMAIL"
            "enableStripeSecrets=$ENABLE_STRIPE_SECRETS"
            "enableResendSecrets=$ENABLE_RESEND_SECRETS"
            "enableGoogleOauthSecrets=$ENABLE_GOOGLE_OAUTH_SECRETS"
            "enableMicrosoftOauthSecrets=$ENABLE_MICROSOFT_OAUTH_SECRETS"
            "postgresAdminPassword=$POSTGRES_ADMIN_PASSWORD"
          )
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/selfserve-staging/main.bicep \
            --parameters "${parameters[@]}"

      - name: Apply Azure deployment
        if: ${{ inputs.operation == 'deploy' && (!inputs.prepare_migration_job || inputs.deploy_container_apps) }}
        shell: bash
        run: |
          set -euo pipefail
          parameters=(
            "location=$LOCATION"
            "namePrefix=$NAME_PREFIX"
            "deployContainerApps=$DEPLOY_CONTAINER_APPS"
            "deployMigrationJob=$PREPARE_MIGRATION_JOB"
            "sharedStateBackend=$SHARED_STATE_BACKEND"
            "appUrl=$APP_URL"
            "siteUrl=$SITE_URL"
            "controlPlaneUrl=$CONTROL_PLANE_URL"
            "webImage=$web_image"
            "workerImage=$worker_image"
            "releaseVersion=$release_version"
            "releaseImageTag=$release_image_tag"
            "releaseGitSha=$release_git_sha"
            "registryServer=$registry_server"
            "registryUsername=$registry_username"
            "azureOpenAiBaseUrl=$AZURE_OPENAI_BASE_URL"
            "azureFoundryBaseUrl=$AZURE_FOUNDRY_BASE_URL"
            "modelProvider=$MODEL_PROVIDER"
            "azureOpenAiAuthMode=$AZURE_OPENAI_AUTH_MODE"
            "allowAzureServicePostgresFirewall=$ALLOW_AZURE_SERVICE_POSTGRES_FIREWALL"
            "smokeEmailCaptureAllowedDomains=$SMOKE_EMAIL_CAPTURE_ALLOWED_DOMAINS"
            "crmInquiryWorkspaceSlug=$CRM_INQUIRY_WORKSPACE_SLUG"
            "crmInquiryAcknowledgementCcEmail=$CRM_INQUIRY_ACKNOWLEDGEMENT_CC_EMAIL"
            "enableStripeSecrets=$ENABLE_STRIPE_SECRETS"
            "enableResendSecrets=$ENABLE_RESEND_SECRETS"
            "enableGoogleOauthSecrets=$ENABLE_GOOGLE_OAUTH_SECRETS"
            "enableMicrosoftOauthSecrets=$ENABLE_MICROSOFT_OAUTH_SECRETS"
            "postgresAdminPassword=$POSTGRES_ADMIN_PASSWORD"
          )
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "selfserve-staging-${GITHUB_RUN_ID}" \
            --template-file infra/azure/selfserve-staging/main.bicep \
            --parameters "${parameters[@]}" \
            --output table

      - name: Update existing migration job image only
        if: ${{ inputs.operation == 'deploy' && inputs.prepare_migration_job && !inputs.deploy_container_apps }}
        shell: bash
        run: |
          set -euo pipefail
          job_name="caj-${NAME_PREFIX}-migrate"
          before="$(mktemp)"
          after="$(mktemp)"
          trap 'rm -f "$before" "$after"' EXIT
          snapshot_query='{identity:identity,environmentId:properties.environmentId,workloadProfileName:properties.workloadProfileName,configuration:properties.configuration,template:properties.template}'
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" --query "$snapshot_query" --output json > "$before"
          python3 - "$before" "$migration_job_source_image" <<'PY'
          import json
          import sys

          before = json.load(open(sys.argv[1], encoding="utf-8"))
          containers = before["template"]["containers"]
          if len(containers) != 1 or containers[0]["name"] != "migrate" or containers[0]["image"] != sys.argv[2]:
              raise SystemExit("Migration job changed since preview; refusing image update")
          PY
          az containerapp job update --resource-group "$RESOURCE_GROUP" --name "$job_name" --container-name migrate --image "$migration_job_target_image" --output none
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job_name" --query "$snapshot_query" --output json > "$after"
          python3 scripts/migration/verify-staging-job-image.py "$before" "$after" "$migration_job_target_image"

      - name: Run migration job
        if: ${{ inputs.operation == 'run-migration' && inputs.run_migration_job }}
        shell: bash
        run: |
          set -euo pipefail
          job_name="caj-${NAME_PREFIX}-migrate"
          execution_name="$(az containerapp job start \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --query name \
            --output tsv)"

          echo "Started migration execution $execution_name."
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            status="$(az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution_name" \
              --query properties.status \
              --output tsv)"
            echo "Migration status: $status"
            case "$status" in
              Succeeded)
                exit 0
                ;;
              Failed|Canceled)
                echo "::error::Migration job ended with status $status."
                exit 1
                ;;
            esac
            sleep 20
          done

          echo "::error::Migration job did not finish within 30 minutes."
          exit 1

      - name: Probe Azure web health
        if: ${{ inputs.run_health_smoke || (inputs.operation == 'deploy' && inputs.deploy_container_apps) }}
        shell: bash
        run: |
          set -euo pipefail
          web_app_name="ca-${NAME_PREFIX}-web"
          fqdn="$(az containerapp show \
            --name "$web_app_name" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          urls=("$APP_URL")
          if [[ -n "$fqdn" ]]; then
            urls+=("https://${fqdn}")
          fi

          for base_url in "${urls[@]}"; do
            echo "Probing ${base_url}/api/health"
            if curl --fail --silent --show-error --retry 18 --retry-delay 10 --retry-all-errors "${base_url}/api/health"; then
              echo
              exit 0
            fi
          done

          echo "::error::Azure web health smoke failed for configured app URL and Container Apps FQDN."
          exit 1

      - name: Install browser smoke dependencies
        if: ${{ inputs.run_browser_smoke }}
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run self-serve browser smoke
        if: ${{ inputs.run_browser_smoke }}
        env:
          SELF_SERVE_BROWSER_ALLOW_BILLING_SKIP: "1"
        run: |
          node scripts/self-serve-browser-smoke.mjs \
            --base-url "$APP_URL" \
            --site-url "$SITE_URL" \
            --run-id "azure-selfserve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --email-domain "$SELF_SERVE_SMOKE_EMAIL_DOMAIN" \
            --artifacts-dir ".artifacts/azure-selfserve-staging/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Upload browser smoke artifacts
        if: ${{ always() && inputs.run_browser_smoke }}
        uses: actions/upload-artifact@v4
        with:
          name: azure-selfserve-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/azure-selfserve-staging/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
