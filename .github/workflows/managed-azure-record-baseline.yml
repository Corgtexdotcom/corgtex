name: Managed Azure Record Verified Baseline

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Exact managed Azure deployment UUID
        required: true
        type: string
      release_image_tag:
        description: Already-live release image tag to record
        required: true
        type: string
      release_version:
        description: Already-live release version label to record
        required: true
        type: string
      resource_group:
        description: Exact Azure resource group containing the already-live Container Apps
        required: true
        type: string
      web_app_name:
        description: Exact already-live web Container App name
        required: true
        type: string
      worker_app_name:
        description: Exact already-live worker Container App name
        required: true
        type: string
      reason:
        description: Audited reason for recording this verified baseline
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: managed-azure-record-baseline-${{ inputs.deployment_id }}
  cancel-in-progress: false

jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: managed-azure-release-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify already-live Azure release metadata
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WEB_APP_NAME: ${{ inputs.web_app_name }}
          WORKER_APP_NAME: ${{ inputs.worker_app_name }}
          RELEASE_IMAGE_TAG: ${{ inputs.release_image_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          verify_role() {
            local role="$1"
            local app_name="$2"
            local payload_file="$RUNNER_TEMP/managed-azure-record-baseline-${role}.json"

            az containerapp show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$app_name" \
              --query '{containers:properties.template.containers}' \
              --output json > "$payload_file"

            node --input-type=module - "$payload_file" "$role" "$RELEASE_IMAGE_TAG" "$RELEASE_VERSION" <<'NODE'
          import { readFileSync } from "node:fs";

          const [payloadPath, role, releaseImageTag, releaseVersion] = process.argv.slice(2);
          const payload = JSON.parse(readFileSync(payloadPath, "utf8"));
          const containers = Array.isArray(payload.containers) ? payload.containers : [];
          const expectedImageSuffix = `/corgtex/${role}:${releaseImageTag}`;
          const matchingContainer = containers.find((container) => String(container?.image ?? "").endsWith(expectedImageSuffix));

          if (!matchingContainer) {
            console.error(`::error::${role} image tag does not match the requested verified baseline`);
            process.exit(1);
          }

          const env = new Map((Array.isArray(matchingContainer.env) ? matchingContainer.env : []).map((entry) => [entry?.name, entry?.value]));
          const expectedGitSha = releaseImageTag.startsWith("sha-") ? releaseImageTag.slice(4) : null;
          const checks = [
            ["CORGTEX_RELEASE_IMAGE_TAG", releaseImageTag],
            ["CORGTEX_RELEASE_VERSION", releaseVersion],
            ["CORGTEX_RELEASE_GIT_SHA", expectedGitSha],
          ];

          for (const [name, expected] of checks) {
            if (!expected || env.get(name) !== expected) {
              console.error(`::error::${role} release metadata does not match the requested verified baseline`);
              process.exit(1);
            }
          }
          NODE
          }

          verify_role web "$WEB_APP_NAME"
          verify_role worker "$WORKER_APP_NAME"
      - name: Record verified release baseline
        env:
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_IMAGE_TAG: ${{ inputs.release_image_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          REASON: ${{ inputs.reason }}
        run: |
          node scripts/control-plane.mjs record-release "$DEPLOYMENT_ID" "$RELEASE_IMAGE_TAG" "$REASON" "$RELEASE_VERSION"
