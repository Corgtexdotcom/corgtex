name: Private CI pgvector cache

on:
  workflow_dispatch:

permissions:
  packages: write

concurrency:
  group: ci-pgvector-cache
  cancel-in-progress: false

jobs:
  copy:
    name: Copy verified PostgreSQL images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require verified private package access
        env:
          ACCESS_CONFIRMED: ${{ vars.CI_PGVECTOR_PRIVATE_ACCESS_CONFIRMED }}
        run: |
          if [[ "$ACCESS_CONFIRMED" != true ]]; then
            echo 'Confirm that Corgtex CI is the only package publisher/reader and that repository access inheritance is disabled before dispatch.' >&2
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install manifest-preserving registry copier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
      - name: Refuse an existing nonprivate package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api -i 'orgs/Corgtexdotcom/packages/container/corgtex%2Fci-pgvector' 2>&1 || true)"
          status="$(printf '%s\n' "$response" | sed -n '1s/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p')"
          case "$status" in
            200)
              visibility="$(printf '%s\n' "$response" | sed -n '/^{/,$p' | jq -r .visibility)"
              test "$visibility" = private ;;
            404) ;;
            *) echo "Package preflight failed with HTTP $status" >&2; exit 1 ;;
          esac
      - name: Copy immutable source images and verify every destination digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package='ghcr.io/corgtexdotcom/corgtex/ci-pgvector'
          sources=(
            'pg16 sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a'
            'pg18 sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a'
          )
          for entry in "${sources[@]}"; do
            read -r major digest <<< "$entry"
            source="docker://docker.io/pgvector/pgvector@$digest"
            target="docker://$package:$major-${digest/:/-}"
            source_sha="$(skopeo inspect --raw "$source" | sha256sum | cut -d' ' -f1)"
            test "sha256:$source_sha" = "$digest"
            skopeo copy --all --preserve-digests "$source" "$target"
            target_sha="$(skopeo inspect --raw "$target" | sha256sum | cut -d' ' -f1)"
            test "$target_sha" = "$source_sha"
            echo "$major: verified sha256:$target_sha" >> "$GITHUB_STEP_SUMMARY"
          done
          visibility="$(gh api 'orgs/Corgtexdotcom/packages/container/corgtex%2Fci-pgvector' --jq .visibility)"
          test "$visibility" = private
          echo 'Package visibility: private' >> "$GITHUB_STEP_SUMMARY"
