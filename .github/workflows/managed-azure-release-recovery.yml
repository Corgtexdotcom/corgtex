name: Managed Azure Release Recovery

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Exact managed Azure deployment UUID
        required: true
        type: string
      reason:
        description: Audited reason for clearing an expired fenced recovery lease
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: managed-azure-release-${{ inputs.deployment_id }}
  cancel-in-progress: false

jobs:
  clear-recovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: managed-azure-release-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify baseline and clear recovery lease
        env:
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          MANAGED_AZURE_ACR_NAME: ${{ vars.MANAGED_AZURE_ACR_NAME }}
        run: >-
          node scripts/release/managed-azure-release-recovery.mjs
          --deployment-id "${{ inputs.deployment_id }}"
          --reason "${{ inputs.reason }}"
