name: Production CRM Validation

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "37 9 * * *"

permissions:
  contents: read

jobs:
  crm-production-smoke:
    name: CRM Pending-Operation Validation
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: fleet-release-production
    timeout-minutes: 35
    env:
      OUT_DIR: .artifacts/production-validation/crm
      WORKSPACE_SLUG: corgtex-validation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Resolve CRM production validation PR coverage
        id: crm-validation-prs
        run: node scripts/production-validation-pr-numbers.mjs --baseline="$PRODUCTION_VALIDATION_BASELINE_PR_NUMBERS" --event-path="$GITHUB_EVENT_PATH" --output="$GITHUB_OUTPUT"
        env:
          PRODUCTION_VALIDATION_BASELINE_PR_NUMBERS: ${{ vars.PRODUCTION_VALIDATION_CRM_BASELINE_PR_NUMBERS || '696' }}

      - name: Detect whether app release SHA should match this commit
        id: release-match
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "expected_git_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "expected_git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only HEAD^ HEAD)"
          requires_app_release=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              AGENTS.md|README.md|knip.jsonc|tsconfig.unused.json|docs/*|.github/*|.agents/*|.codex/*|apps/site/*)
                ;;
              *)
                requires_app_release=true
                ;;
            esac
          done <<< "$changed_files"

          if [ "$requires_app_release" = "true" ]; then
            echo "expected_git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "expected_git_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check production CRM validation credentials
        id: credentials
        shell: bash
        env:
          CRM_SMOKE_EMAIL: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          CRM_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$CRM_SMOKE_EMAIL" ] && [ -n "$CRM_SMOKE_PASSWORD" ] && echo "available=true" >> "$GITHUB_OUTPUT" || echo "available=false" >> "$GITHUB_OUTPUT"

      - name: Record blocked CRM validation for missing credentials
        if: steps.credentials.outputs.available != 'true'
        run: |
          node scripts/production-validation-blocked.mjs \
            --out-dir="$OUT_DIR" \
            --base-url="https://app.corgtex.com" \
            --tenant-slug="$WORKSPACE_SLUG" \
            --pr-numbers="${{ steps.crm-validation-prs.outputs.pr_numbers }}" \
            --method="crm-production-smoke" \
            --intent="CRM pages, MCP reads, chat context, and safe writeback" \
            --blocker="PRODUCTION_VALIDATION_ADMIN_EMAIL/PASSWORD or ADMIN_EMAIL/PASSWORD production smoke secrets are required."

      - run: npm ci
        if: steps.credentials.outputs.available == 'true'

      - name: Install browser runtime
        if: steps.credentials.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run CRM pending-operation production smoke
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          if [ -n "$EXPECTED_GIT_SHA" ]; then
            export CRM_SMOKE_EXPECTED_GIT_SHA="$EXPECTED_GIT_SHA"
          fi
          node scripts/crm-production-smoke.mjs https://app.corgtex.com "$OUT_DIR" 2>&1 | tee "$OUT_DIR/crm-production-smoke.log"
        env:
          CRM_SMOKE_EMAIL: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          CRM_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_VALIDATION_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          CRM_SMOKE_WORKSPACE_SLUG: ${{ env.WORKSPACE_SLUG }}
          CRM_SMOKE_PR_NUMBERS: ${{ steps.crm-validation-prs.outputs.pr_numbers }}
          EXPECTED_GIT_SHA: ${{ steps.release-match.outputs.expected_git_sha }}

      - name: Add validation report to summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$(find "$OUT_DIR" -maxdepth 1 -name '*.report.md' -print -quit 2>/dev/null || true)"
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No CRM validation report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-crm-validation
          path: .artifacts/production-validation/crm
          if-no-files-found: warn
