name: Review Snapshot Integrity
on:
  pull_request_target:
    branches: [main]
    types:
      - opened
      - reopened
      - edited
      - labeled
      - unlabeled
      - synchronize
      - ready_for_review
      - converted_to_draft
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: review-snapshot-integrity-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    name: Review Snapshot Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: node scripts/review-snapshot-integrity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
