name: Azure Self-Serve Production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "what-if prints the planned production release; deploy builds images, updates Container Apps, and smokes health."
        required: true
        type: choice
        default: what-if
        options:
          - what-if
          - deploy
      release_git_sha:
        description: "Immutable Git SHA to build and release."
        required: true
        type: string
      release_version:
        description: "Release version surfaced by /api/health. Defaults to main-<short sha> when empty."
        required: false
        type: string
      resource_group:
        description: "Azure production resource group."
        required: true
        type: string
        default: rg-corgtex-selfserve-production-wus3
      acr_name:
        description: "Azure Container Registry name."
        required: true
        type: string
        default: acrcorgtexssstgwus3
      app_url:
        description: "Public production self-serve app origin."
        required: true
        type: string
        default: https://selfserve.corgtex.com
      web_app_name:
        description: "Azure Container App name for web."
        required: true
        type: string
        default: ca-corgtex-ss-prod-web
      worker_app_name:
        description: "Azure Container App name for worker."
        required: true
        type: string
        default: ca-corgtex-ss-prod-worker
      build_images:
        description: "Build and push web/worker images into ACR before updating Container Apps."
        required: true
        type: boolean
        default: true
      run_health_smoke:
        description: "Probe selfserve.corgtex.com/api/health and require the release SHA."
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: azure-selfserve-production
  cancel-in-progress: false

jobs:
  release:
    name: Release Azure self-serve production
    runs-on: ubuntu-latest
    environment: azure-selfserve-production
    env:
      OPERATION: ${{ inputs.operation }}
      RELEASE_GIT_SHA: ${{ inputs.release_git_sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      RESOURCE_GROUP: ${{ inputs.resource_group }}
      ACR_NAME: ${{ inputs.acr_name }}
      APP_URL: ${{ inputs.app_url }}
      WEB_APP_NAME: ${{ inputs.web_app_name }}
      WORKER_APP_NAME: ${{ inputs.worker_app_name }}
      BUILD_IMAGES: ${{ inputs.build_images }}
      RUN_HEALTH_SMOKE: ${{ inputs.run_health_smoke }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
      POSTHOG_ENABLED: ${{ vars.POSTHOG_ENABLED }}
      POSTHOG_CAPTURE_KILL_SWITCH: ${{ vars.POSTHOG_CAPTURE_KILL_SWITCH || 'false' }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST || 'https://us.i.posthog.com' }}
      POSTHOG_ENVIRONMENT: ${{ vars.POSTHOG_ENVIRONMENT || 'production' }}
      POSTHOG_EVENT_SAMPLE_RATE: ${{ vars.POSTHOG_EVENT_SAMPLE_RATE || '1' }}
      POSTHOG_CAPTURE_TIMEOUT_MS: ${{ vars.POSTHOG_CAPTURE_TIMEOUT_MS || '1500' }}
      POSTHOG_CAPTURE_DEBUG: ${{ vars.POSTHOG_CAPTURE_DEBUG || 'false' }}
      POSTHOG_INSTANCE_ID: ${{ vars.POSTHOG_INSTANCE_ID || '' }}
      AZURE_APPLICATIONINSIGHTS_APP_NAME: ${{ vars.AZURE_APPLICATIONINSIGHTS_APP_NAME || 'appi-corgtex-ss-prod' }}
      AZURE_APPLICATIONINSIGHTS_RESOURCE_GROUP: ${{ vars.AZURE_APPLICATIONINSIGHTS_RESOURCE_GROUP || inputs.resource_group }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY || secrets.POSTHOG_QUERY_API_KEY }}
      POSTHOG_QUERY_API_HOST: ${{ vars.POSTHOG_QUERY_API_HOST }}
      GITHUB_TOKEN: ${{ github.token }}
      OPS_GITHUB_REPOSITORY: ${{ github.repository }}
      OBSERVATION_WINDOW_MINUTES: ${{ vars.OBSERVATION_WINDOW_MINUTES || '20' }}

    steps:
      - name: Validate workflow configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID RELEASE_GIT_SHA; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf "::error::Missing GitHub environment settings: %s\\n" "${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_git_sha }}

      - name: Confirm checked out release
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$RELEASE_GIT_SHA" ]]; then
            echo "::error::Checked out $checked_out_sha but expected $RELEASE_GIT_SHA."
            exit 1
          fi

      - name: Log in to Azure
        if: ${{ inputs.operation == 'deploy' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Release production Container Apps
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --sha "$RELEASE_GIT_SHA"
            --resource-group "$RESOURCE_GROUP"
            --acr-name "$ACR_NAME"
            --web-app-name "$WEB_APP_NAME"
            --worker-app-name "$WORKER_APP_NAME"
            --app-url "$APP_URL"
          )
          if [[ -n "$RELEASE_VERSION" ]]; then
            args+=(--version "$RELEASE_VERSION")
          fi
          if [[ "$OPERATION" == "what-if" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$BUILD_IMAGES" != "true" ]]; then
            args+=(--skip-build)
          fi
          if [[ "$RUN_HEALTH_SMOKE" != "true" ]]; then
            args+=(--skip-health-smoke)
          fi
          node scripts/azure-selfserve-production-release.mjs "${args[@]}"

      - name: Checkout observation gate source
        if: ${{ inputs.operation == 'deploy' && inputs.run_health_smoke }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .workflow-source

      - name: Run post-deploy observation gate
        if: ${{ inputs.operation == 'deploy' && inputs.run_health_smoke }}
        shell: bash
        working-directory: .workflow-source
        run: |
          set -euo pipefail
          mkdir -p .artifacts/post-deploy-observation-gate
          release_version="${RELEASE_VERSION:-main-${RELEASE_GIT_SHA:0:12}}"
          node scripts/post-deploy-observation-gate.mjs \
            --release-git-sha "$RELEASE_GIT_SHA" \
            --release-image-tag "sha-$RELEASE_GIT_SHA" \
            --release-version "$release_version" \
            --targets azure-selfserve \
            --summary-file .artifacts/post-deploy-observation-gate/azure-selfserve-production.json \
            --publish-advisories

      - name: Upload observation summary
        if: ${{ always() && inputs.operation == 'deploy' }}
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-observation-azure-selfserve
          path: .workflow-source/.artifacts/post-deploy-observation-gate/azure-selfserve-production.json
          if-no-files-found: ignore
