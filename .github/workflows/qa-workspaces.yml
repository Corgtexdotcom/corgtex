name: QA Workspaces

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full protected main SHA currently serving on selfserve."
        required: true
        type: string
      mode:
        description: "Read-only preflight first; apply performs only the selected operation."
        required: true
        type: choice
        options: [preflight, apply]
        default: preflight
      operation:
        description: "Fixture provisioning or guarded ownership adoption without fixture refresh."
        required: true
        type: choice
        options: [fixtures, adopt-validation-owner]
        default: fixtures
      demo_workspace_id:
        description: "Reviewed existing jnj-demo ID; leave empty only for initial creation."
        required: false
        type: string
      validation_workspace_id:
        description: "Reviewed existing corgtex-validation ID; leave empty only for initial creation."
        required: false
        type: string
      validation_admin_user_id:
        description: "Reviewed existing dedicated seed admin ID; required for owner adoption apply."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: fleet-release
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: fleet-release-production
    env:
      QA_EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
      QA_PROVISION_MODE: ${{ inputs.mode }}
      QA_OPERATION: ${{ inputs.operation }}
      QA_EXPECTED_DEMO_WORKSPACE_ID: ${{ inputs.demo_workspace_id }}
      QA_EXPECTED_VALIDATION_WORKSPACE_ID: ${{ inputs.validation_workspace_id }}
      QA_EXPECTED_VALIDATION_ADMIN_USER_ID: ${{ inputs.validation_admin_user_id }}
      QA_EXECUTION_ACTOR: ${{ github.triggering_actor }}
      QA_EXECUTION_INITIATOR: ${{ github.actor }}
      QA_EXECUTION_REPOSITORY: ${{ github.repository }}
      QA_EXECUTION_RUN_ID: ${{ github.run_id }}
      QA_EXECUTION_RUN_ATTEMPT: ${{ github.run_attempt }}
      QA_EXECUTION_WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify protected source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QA_EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$QA_EXPECTED_RELEASE_SHA" origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run selected serialized QA operation
        run: node scripts/provision-qa-azure.mjs
