name: Managed Azure Single-Target Release

on:
  workflow_dispatch:
    inputs:
      hotfix_evidence:
        description: Exact candidate/recovery build and startup-proof run, attempt and artifact IDs; required only for the admitted hotfix
        required: false
        type: string
      inventory_ref:
        description: Optional Ops inventory asset ID; leave both inventory fields blank to freeze automatically
        required: false
        type: string
      inventory_sha256:
        description: Optional SHA-256 of the exact inventory bytes
        required: false
        type: string
      deployment_id:
        description: Exact managed Azure deployment UUID
        required: true
        type: string
      workload_class:
        description: Exact workload class for inventory target binding
        required: true
        type: string
      release_sha:
        description: Full 40-character Git release SHA
        required: true
        type: string
      release_version:
        description: Bounded release version label
        required: true
        type: string
      reason:
        description: Audited reason for this exact-target release
        required: true
        type: string
      execute:
        description: Apply the release after all gates pass
        required: true
        type: boolean
        default: false
      acr_name:
        description: Exact protected target Azure Container Registry name
        required: true
        type: string
      acr_resource_group:
        description: Exact protected target Azure Container Registry resource group
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read

concurrency:
  group: managed-azure-release-${{ inputs.deployment_id }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.ref == 'refs/heads/main' && inputs.execute != true
    runs-on: ubuntu-latest
    # Includes both complete baseline censuses and paced provider preparation.
    timeout-minutes: 30
    environment: managed-azure-release-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          path: .release-source
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source and exact hotfix build/recovery proofs before provider access
        env:
          HOTFIX_SOURCE_ROOT: .release-source
          HOTFIX_SOURCE_SHA: ${{ inputs.release_sha }}
          HOTFIX_TARGET_ID: ${{ inputs.deployment_id }}
          HOTFIX_EVIDENCE: ${{ inputs.hotfix_evidence }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/selfserve-hotfix-gate.mjs release
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_IMPORT_TOKEN && vars.GHCR_IMPORT_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_IMPORT_TOKEN || github.token }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Select explicit inventory or freeze fresh exact inventory
        id: inventory
        shell: bash
        env:
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          RELEASE_INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_INPUT_WORKLOAD_CLASS: ${{ inputs.workload_class }}
          PROVIDED_INVENTORY_REF: ${{ inputs.inventory_ref }}
          PROVIDED_INVENTORY_SHA: ${{ inputs.inventory_sha256 }}
          ACR_NAME: ${{ inputs.acr_name }}
          RELEASE_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [[ -n "$PROVIDED_INVENTORY_REF" || -n "$PROVIDED_INVENTORY_SHA" ]]; then
            [[ "$PROVIDED_INVENTORY_REF" =~ ^[0-9a-f-]{36}$ && "$PROVIDED_INVENTORY_SHA" =~ ^[0-9a-f]{64}$ ]]
            printf 'ref=%s\nsha256=%s\n' "$PROVIDED_INVENTORY_REF" "$PROVIDED_INVENTORY_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RELEASE_INPUT_WORKLOAD_CLASS" == ACTIVE_CLIENT_PRIMARY && "$ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]]
          scratch="$(mktemp)"
          trap 'rm -f "$scratch"' EXIT
          payload="$(jq -cn --arg id "$RELEASE_INPUT_DEPLOYMENT_ID" --arg class "$RELEASE_INPUT_WORKLOAD_CLASS" --arg acr "$ACR_NAME" --arg reason "$RELEASE_REASON" '{deploymentId:$id,workloadClass:$class,acrName:$acr,acrServer:($acr+".azurecr.io"),reason:$reason}')"
          node scripts/control-plane.mjs call freeze_managed_release_inventory "$payload" > "$scratch"
          node scripts/release/managed-azure-single-run-preflight.mjs inventory "$scratch"
      - name: Verify exact target without effects
        env:
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          GHCR_IMPORT_USERNAME: ${{ secrets.GHCR_IMPORT_TOKEN && vars.GHCR_IMPORT_USERNAME || github.actor }}
          GHCR_IMPORT_TOKEN: ${{ secrets.GHCR_IMPORT_TOKEN || github.token }}
          MANAGED_AZURE_ACR_NAME: ${{ inputs.acr_name }}
          MANAGED_AZURE_ACR_RESOURCE_GROUP: ${{ inputs.acr_resource_group }}
          RELEASE_INPUT_INVENTORY_REF: ${{ steps.inventory.outputs.ref }}
          RELEASE_INPUT_INVENTORY_SHA256: ${{ steps.inventory.outputs.sha256 }}
          RELEASE_INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_INPUT_WORKLOAD_CLASS: ${{ inputs.workload_class }}
          RELEASE_INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_INPUT_REASON: ${{ inputs.reason }}
        run: >-
          node scripts/release/managed-azure-release-transaction.mjs
          --inventory-ref "$RELEASE_INPUT_INVENTORY_REF"
          --inventory-sha256 "$RELEASE_INPUT_INVENTORY_SHA256"
          --deployment-id "$RELEASE_INPUT_DEPLOYMENT_ID"
          --workload-class "$RELEASE_INPUT_WORKLOAD_CLASS"
          --release-sha "$RELEASE_INPUT_RELEASE_SHA"
          --release-version "$RELEASE_INPUT_RELEASE_VERSION"
          --reason "$RELEASE_INPUT_REASON"
          --execute false

  execute:
    if: github.ref == 'refs/heads/main' && inputs.execute == true
    runs-on: ubuntu-latest
    # Full supported revision history is retained during owned, paced reads.
    timeout-minutes: 240
    environment: managed-azure-release-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          path: .release-source
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source and exact hotfix build/recovery proofs before provider access
        env:
          HOTFIX_SOURCE_ROOT: .release-source
          HOTFIX_SOURCE_SHA: ${{ inputs.release_sha }}
          HOTFIX_TARGET_ID: ${{ inputs.deployment_id }}
          HOTFIX_EVIDENCE: ${{ inputs.hotfix_evidence }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/selfserve-hotfix-gate.mjs release
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_IMPORT_TOKEN && vars.GHCR_IMPORT_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_IMPORT_TOKEN || github.token }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Select explicit inventory or freeze fresh exact inventory
        id: inventory
        shell: bash
        env:
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          RELEASE_INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_INPUT_WORKLOAD_CLASS: ${{ inputs.workload_class }}
          PROVIDED_INVENTORY_REF: ${{ inputs.inventory_ref }}
          PROVIDED_INVENTORY_SHA: ${{ inputs.inventory_sha256 }}
          ACR_NAME: ${{ inputs.acr_name }}
          RELEASE_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [[ -n "$PROVIDED_INVENTORY_REF" || -n "$PROVIDED_INVENTORY_SHA" ]]; then
            [[ "$PROVIDED_INVENTORY_REF" =~ ^[0-9a-f-]{36}$ && "$PROVIDED_INVENTORY_SHA" =~ ^[0-9a-f]{64}$ ]]
            printf 'ref=%s\nsha256=%s\n' "$PROVIDED_INVENTORY_REF" "$PROVIDED_INVENTORY_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RELEASE_INPUT_WORKLOAD_CLASS" == ACTIVE_CLIENT_PRIMARY && "$ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]]
          scratch="$(mktemp)"
          trap 'rm -f "$scratch"' EXIT
          payload="$(jq -cn --arg id "$RELEASE_INPUT_DEPLOYMENT_ID" --arg class "$RELEASE_INPUT_WORKLOAD_CLASS" --arg acr "$ACR_NAME" --arg reason "$RELEASE_REASON" '{deploymentId:$id,workloadClass:$class,acrName:$acr,acrServer:($acr+".azurecr.io"),reason:$reason}')"
          if ! node scripts/control-plane.mjs call freeze_managed_release_inventory "$payload" > "$scratch"; then
            echo '### Managed Azure inventory freeze failed' >> "$GITHUB_STEP_SUMMARY"
            echo 'The release did not execute. Inspect the current Ops lease before retrying.' >> "$GITHUB_STEP_SUMMARY"
            status_payload="$(jq -cn --arg id "$RELEASE_INPUT_DEPLOYMENT_ID" --arg acr "$ACR_NAME" '{operation:"get_recovery",deploymentId:$id,acrName:$acr,acrServer:($acr+".azurecr.io")}')"
            if timeout 20s node scripts/control-plane.mjs call managed_release_lease "$status_payload" > "$scratch" 2>/dev/null; then
              jq -er '
                select(.phase == "MUTATING" or .phase == "RECOVERY_REQUIRED")
                | select((.fence | type) == "number" and (.expiresAt | type) == "string")
                | select(.expiresAt | test("^[0-9TZ:.+-]+$"))
                | "- Recovery phase: \(.phase)\n- Fence: \(.fence)\n- Lease expiration (UTC): \(.expiresAt)"
              ' "$scratch" >> "$GITHUB_STEP_SUMMARY" || echo 'No active recovery status was returned.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Recovery status was unavailable.' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
          node scripts/release/managed-azure-single-run-preflight.mjs inventory "$scratch"
      - name: Execute approved exact-target release
        env:
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          GHCR_IMPORT_USERNAME: ${{ secrets.GHCR_IMPORT_TOKEN && vars.GHCR_IMPORT_USERNAME || github.actor }}
          GHCR_IMPORT_TOKEN: ${{ secrets.GHCR_IMPORT_TOKEN || github.token }}
          MANAGED_AZURE_ACR_NAME: ${{ inputs.acr_name }}
          MANAGED_AZURE_ACR_RESOURCE_GROUP: ${{ inputs.acr_resource_group }}
          PROVIDED_INVENTORY_REF: ${{ inputs.inventory_ref }}
          RELEASE_INPUT_INVENTORY_REF: ${{ steps.inventory.outputs.ref }}
          RELEASE_INPUT_INVENTORY_SHA256: ${{ steps.inventory.outputs.sha256 }}
          RELEASE_INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_INPUT_WORKLOAD_CLASS: ${{ inputs.workload_class }}
          RELEASE_INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_INPUT_REASON: ${{ inputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp)"
          trap 'rm -f "$scratch"' EXIT
          args=(--inventory-ref "$RELEASE_INPUT_INVENTORY_REF"
            --inventory-sha256 "$RELEASE_INPUT_INVENTORY_SHA256"
            --deployment-id "$RELEASE_INPUT_DEPLOYMENT_ID"
            --workload-class "$RELEASE_INPUT_WORKLOAD_CLASS"
            --release-sha "$RELEASE_INPUT_RELEASE_SHA"
            --release-version "$RELEASE_INPUT_RELEASE_VERSION"
            --reason "$RELEASE_INPUT_REASON")
          if [[ -z "$PROVIDED_INVENTORY_REF" ]]; then
            node scripts/release/managed-azure-release-transaction.mjs "${args[@]}" --execute false > "$scratch"
            node scripts/release/managed-azure-single-run-preflight.mjs preflight "$scratch"
            cat "$scratch"
          fi
          node scripts/release/managed-azure-release-transaction.mjs "${args[@]}" --execute true
