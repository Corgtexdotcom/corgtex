name: Managed Azure Single-Target Release

on:
  workflow_dispatch:
    inputs:
      inventory_ref:
        description: Immutable private Ops inventory asset ID
        required: true
        type: string
      inventory_sha256:
        description: SHA-256 of the exact inventory bytes
        required: true
        type: string
      deployment_id:
        description: Exact managed Azure deployment UUID
        required: true
        type: string
      workload_class:
        description: Exact workload class for inventory target binding
        required: true
        type: string
      release_sha:
        description: Full 40-character Git release SHA
        required: true
        type: string
      release_version:
        description: Bounded release version label
        required: true
        type: string
      reason:
        description: Audited reason for this exact-target release
        required: true
        type: string
      execute:
        description: Apply the release after all gates pass
        required: true
        type: boolean
        default: false
      acr_name:
        description: Exact protected target Azure Container Registry name
        required: true
        type: string
      acr_resource_group:
        description: Exact protected target Azure Container Registry resource group
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: managed-azure-release-${{ inputs.deployment_id }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.ref == 'refs/heads/main' && inputs.execute != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: managed-azure-release-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_IMPORT_TOKEN && vars.GHCR_IMPORT_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_IMPORT_TOKEN || github.token }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify exact target without effects
        env:
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          GHCR_IMPORT_USERNAME: ${{ secrets.GHCR_IMPORT_TOKEN && vars.GHCR_IMPORT_USERNAME || github.actor }}
          GHCR_IMPORT_TOKEN: ${{ secrets.GHCR_IMPORT_TOKEN || github.token }}
          MANAGED_AZURE_ACR_NAME: ${{ inputs.acr_name }}
          MANAGED_AZURE_ACR_RESOURCE_GROUP: ${{ inputs.acr_resource_group }}
          RELEASE_INPUT_INVENTORY_REF: ${{ inputs.inventory_ref }}
          RELEASE_INPUT_INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
          RELEASE_INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_INPUT_WORKLOAD_CLASS: ${{ inputs.workload_class }}
          RELEASE_INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_INPUT_REASON: ${{ inputs.reason }}
        run: >-
          node scripts/release/managed-azure-release-transaction.mjs
          --inventory-ref "$RELEASE_INPUT_INVENTORY_REF"
          --inventory-sha256 "$RELEASE_INPUT_INVENTORY_SHA256"
          --deployment-id "$RELEASE_INPUT_DEPLOYMENT_ID"
          --workload-class "$RELEASE_INPUT_WORKLOAD_CLASS"
          --release-sha "$RELEASE_INPUT_RELEASE_SHA"
          --release-version "$RELEASE_INPUT_RELEASE_VERSION"
          --reason "$RELEASE_INPUT_REASON"
          --execute false

  execute:
    if: github.ref == 'refs/heads/main' && inputs.execute == true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: managed-azure-release-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_IMPORT_TOKEN && vars.GHCR_IMPORT_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_IMPORT_TOKEN || github.token }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Execute approved exact-target release
        env:
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          CONTROL_PLANE_AGENT_API_KEY: ${{ secrets.CONTROL_PLANE_AGENT_API_KEY }}
          GHCR_IMPORT_USERNAME: ${{ secrets.GHCR_IMPORT_TOKEN && vars.GHCR_IMPORT_USERNAME || github.actor }}
          GHCR_IMPORT_TOKEN: ${{ secrets.GHCR_IMPORT_TOKEN || github.token }}
          MANAGED_AZURE_ACR_NAME: ${{ inputs.acr_name }}
          MANAGED_AZURE_ACR_RESOURCE_GROUP: ${{ inputs.acr_resource_group }}
          RELEASE_INPUT_INVENTORY_REF: ${{ inputs.inventory_ref }}
          RELEASE_INPUT_INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
          RELEASE_INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_INPUT_WORKLOAD_CLASS: ${{ inputs.workload_class }}
          RELEASE_INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_INPUT_REASON: ${{ inputs.reason }}
        run: >-
          node scripts/release/managed-azure-release-transaction.mjs
          --inventory-ref "$RELEASE_INPUT_INVENTORY_REF"
          --inventory-sha256 "$RELEASE_INPUT_INVENTORY_SHA256"
          --deployment-id "$RELEASE_INPUT_DEPLOYMENT_ID"
          --workload-class "$RELEASE_INPUT_WORKLOAD_CLASS"
          --release-sha "$RELEASE_INPUT_RELEASE_SHA"
          --release-version "$RELEASE_INPUT_RELEASE_VERSION"
          --reason "$RELEASE_INPUT_REASON"
          --execute true
