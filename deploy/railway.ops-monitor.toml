"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "/deploy/Dockerfile.ops-monitor"
watchPatterns = [
  "scripts/ops/**",
  "deploy/Dockerfile.ops-monitor",
  "deploy/railway.ops-monitor.toml",
]

[deploy]
cronSchedule = "*/15 * * * *"
restartPolicyType = "NEVER"
runtime = "V2"
