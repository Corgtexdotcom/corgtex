"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "/deploy/Dockerfile.worker"
watchPatterns = [
  "**",
]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 100

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
runtime = "V2"
